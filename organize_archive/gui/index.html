<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>organize_archive</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#14161a">
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="/vendor/leaflet.css">
  <script src="/vendor/leaflet.js"></script>
  <script>
    if ("serviceWorker" in navigator)
      window.addEventListener("load", () =>
        navigator.serviceWorker.register("/sw.js").catch(() => { }));
    (() => {
      const saved = localStorage.getItem("archiveTheme");
      const dark = saved ? saved === "dark"
        : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.querySelector('meta[name="theme-color"]').content = dark ? "#101014" : "#f5f5f7";
    })();
  </script>
  <style>
    :root {
      --bg: #14161a;
      --panel: #1c1f26;
      --panel2: #252a33;
      --line: #2e343f;
      --text: #e7e9ee;
      --muted: #9aa3b2;
      --accent: #5b9dff;
      --accent2: #3a7bd5;
      --good: #57c98b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font: 14px/1.45 system-ui, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .btn {
      background: var(--accent2);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      cursor: pointer;
    }

    .btn:hover {
      background: var(--accent);
    }

    .btn.sec {
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .btn:disabled {
      background: var(--panel2);
      color: var(--muted);
      border: 1px solid var(--line);
      cursor: not-allowed;
    }

    .btn:disabled:hover {
      background: var(--panel2);
    }

    .muted {
      color: var(--muted);
    }

    /* ---- archive picker ---- */
    #picker {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    #picker h1 {
      font-size: 22px;
      margin: 0 0 4px;
    }

    #picker .sub {
      color: var(--muted);
      margin-bottom: 26px;
    }

    .cards {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: border-color .15s;
    }

    .card:hover {
      border-color: var(--accent);
    }

    .card h3 {
      margin: 0 0 4px;
      font-size: 15px;
      word-break: break-word;
    }

    .card .path {
      font-size: 11px;
      color: var(--muted);
      word-break: break-all;
      margin-bottom: 10px;
    }

    .card .stats {
      display: flex;
      gap: 14px;
      font-size: 12px;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .card .cardfoot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 13px;
    }

    .remove-archive {
      margin-left: auto;
      background: transparent;
      color: #df7773;
      border: 1px solid #814845;
      border-radius: 7px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }

    .remove-archive:hover {
      background: #542827;
      color: #fff;
    }

    .card.add {
      display: flex;
      align-items: center;
      justify-content: center;
      border-style: dashed;
      color: var(--muted);
      font-size: 15px;
      min-height: 120px;
    }

    .badge-warn {
      color: #e6b45e;
      font-size: 11px;
    }

    /* ---- app shell ---- */
    #app {
      display: none;
    }

    #app.on {
      display: flex;
      min-height: 100vh;
    }

    nav {
      width: 210px;
      flex: none;
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 14px 10px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      transition: width .15s;
      display: flex;
      flex-direction: column;
    }

    nav .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      padding: 4px 8px 12px;
    }

    nav .navtoggle {
      margin-left: auto;
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      padding: 3px 6px;
      border-radius: 5px;
      flex: none;
    }

    nav .navtoggle:hover {
      background: var(--panel2);
      color: var(--text);
    }

    nav .back {
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      display: block;
      padding: 4px 8px;
      margin-bottom: 8px;
    }

    nav .arch {
      font-size: 13px;
      padding: 4px 8px 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 8px;
      word-break: break-word;
    }

    /* Navigation is made from buttons so it works with a keyboard. Reset the
     browser button chrome here; otherwise Chromium renders bright native
     buttons in the dark sidebar. */
    .navitem {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text);
      font-size: 13.5px;
      line-height: 1.25;
    }

    .navitem:hover {
      background: var(--panel2);
    }

    .navitem.active {
      background: var(--accent2);
      color: #fff;
    }

    .navitem.soon {
      color: var(--muted);
      cursor: default;
    }

    .navitem .tag {
      margin-left: auto;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 1px 5px;
    }

    /* Persistent pipeline status, pinned to the bottom of the sidebar so it is
     visible on every section (the app runs itself; this is the ambient bar). */
    .gstat {
      margin-top: auto;
      padding: 9px 8px 2px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.3;
    }

    .gstat .gtxt {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .gstat .gpct {
      margin-left: auto;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      flex: none;
    }

    nav.collapsed .gstat {
      justify-content: center;
      padding: 9px 0 2px;
    }

    nav.collapsed .gstat .gtxt,
    nav.collapsed .gstat .gpct {
      display: none;
    }

    nav.collapsed {
      width: 56px;
    }

    nav.collapsed .brand {
      justify-content: center;
    }

    nav.collapsed .brandtxt,
    nav.collapsed .back,
    nav.collapsed .arch,
    nav.collapsed .navitem span:nth-of-type(2),
    nav.collapsed .navitem .tag {
      display: none;
    }

    nav.collapsed .navtoggle {
      margin-left: 0;
      transform: scaleX(-1);
    }

    nav.collapsed .navitem {
      justify-content: center;
      padding: 8px 4px;
    }

    main {
      flex: 1;
      padding: 22px 26px;
      max-width: 100%;
      overflow: auto;
      height: 100vh;
    }

    h2.sec {
      margin: 0 0 16px;
      font-size: 17px;
    }

    .statrow {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      margin-bottom: 20px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
    }

    .stat .k {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
    }

    .stat .v {
      font-size: 22px;
      font-weight: 600;
      margin-top: 4px;
    }

    .stat .v small {
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .panel h3 {
      margin: 0 0 12px;
      font-size: 14px;
    }

    table.types {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    table.types td {
      padding: 6px 4px;
      border-bottom: 1px solid var(--line);
    }

    .type-summary-bar {
      display: flex;
      height: 14px;
      border-radius: 7px;
      overflow: hidden;
      background: var(--panel2);
    }

    .type-summary-segment {
      min-width: 0;
      transition: width .2s;
    }

    .type-summary-legend {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      margin: 10px 0 8px;
      font-size: 12px;
    }

    .type-summary-key {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      margin-right: 6px;
    }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* tasks */
    .taskcard {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 4px;
      border-bottom: 1px solid var(--line);
    }

    .taskcard:last-child {
      border-bottom: none;
    }

    .taskcard .ico {
      font-size: 20px;
      width: 26px;
      text-align: center;
      flex: none;
    }

    .taskcard .body {
      flex: 1;
      min-width: 0;
    }

    .taskcard .t {
      font-weight: 600;
      font-size: 13.5px;
    }

    .taskcard .d {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .taskcard .d.pending {
      color: #e6b45e;
    }

    .taskcard .d.ok {
      color: var(--good);
    }

    .taskcard .act {
      flex: none;
    }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }

    .dot.ok {
      background: var(--good);
    }

    .dot.pending {
      background: #e6b45e;
    }

    .dot.check {
      background: var(--muted);
    }

    .dot.next {
      background: var(--accent);
    }

    .linkbtn {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 12.5px;
      padding: 6px 0;
    }

    .linkbtn:hover {
      text-decoration: underline;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .spin {
      display: inline-block;
      width: 11px;
      height: 11px;
      border: 2px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }

    .job {
      margin-top: 12px;
      font-size: 13px;
    }

    .job .what {
      font-size: 12px;
      color: var(--text);
      margin-bottom: 3px;
    }

    .job.error .what {
      color: var(--bad, #e06c6c);
    }

    .progress {
      background: var(--panel2);
      border-radius: 6px;
      height: 14px;
      overflow: hidden;
      margin: 6px 0;
    }

    .progfill {
      height: 100%;
      background: var(--good);
      width: 0;
      transition: width .3s;
    }

    .job .cur {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    canvas {
      max-width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    /* map markers */
    .mk {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px #0008;
      background: var(--panel2);
      cursor: pointer;
    }

    .mk img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .mk.mk-ph {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mk.mk-ph::after {
      content: "📍";
      font-size: 20px;
    }

    .mk.mk-sel {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent), 0 2px 6px #0008;
    }

    .mk-cluster {
      position: relative;
      width: 50px;
      height: 50px;
      border-color: var(--accent);
    }

    .mk-cluster span {
      position: absolute;
      top: -8px;
      right: -8px;
      background: var(--accent2);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      border-radius: 11px;
      min-width: 22px;
      height: 22px;
      padding: 0 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--bg);
    }

    /* Leaflet's own panes/controls use z-index up to ~1000; without this the
     map isolates none of that and it renders on top of the modal (z-index:20). */
    .leaflet-container {
      background: #11141a;
      font: inherit;
      position: relative;
      z-index: 0;
    }

    /* place-cluster collage marker: a small photo grid representing "the place" */
    .cgrid {
      display: grid;
      width: 100%;
      height: 100%;
      gap: 1px;
    }

    .cgrid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cgrid.n1 {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
    }

    .cgrid.n2 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
    }

    .cgrid.n3 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

    .cgrid.n3 img:first-child {
      grid-row: 1/3;
    }

    .cgrid.n4 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

    .mk-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--accent2);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 9px;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--bg);
    }

    .leaflet-tooltip {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 11px;
      padding: 2px 7px;
      box-shadow: 0 2px 6px #0008;
    }

    .leaflet-tooltip-top:before {
      border-top-color: var(--panel);
    }

    /* map layout: map on the left, selected place's photos on the right */
    .mapwrap {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    #lmap {
      flex: 1;
      min-width: 0;
      height: 600px;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }

    #mapside {
      width: 300px;
      flex: none;
      height: 600px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      overflow: auto;
    }

    #mapside .empty {
      color: var(--muted);
      text-align: center;
      padding: 70px 10px;
      font-size: 13px;
    }

    #mapside .mapside-name {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    @media (max-width:900px) {
      .mapwrap {
        flex-direction: column;
      }

      #lmap,
      #mapside {
        width: 100%;
        height: 360px;
      }
    }

    /* grid */
    .grid {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    }

    .tile {
      position: relative;
      aspect-ratio: 1;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tile .ph {
      font-size: 32px;
      color: var(--muted);
    }

    .tile .cap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 3px 6px;
      font-size: 10px;
      color: #eef;
      background: linear-gradient(transparent, #000a);
      display: flex;
      justify-content: space-between;
    }

    .tile .badge {
      position: absolute;
      top: 5px;
      right: 6px;
      font-size: 12px;
      text-shadow: 0 1px 2px #000;
    }

    .more {
      text-align: center;
      margin: 16px;
    }

    .chips {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .chip {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 3px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .chip button {
      all: unset;
      margin-left: 6px;
      color: var(--muted);
      cursor: pointer;
    }

    /* Browse filter bar */
    .filterbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 12px;
    }

    .fsel {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      font: inherit;
      cursor: pointer;
      max-width: 190px;
    }

    .fsel:hover {
      border-color: var(--accent);
    }

    .fsel:focus {
      outline: none;
      border-color: var(--accent);
    }

    .fsel:disabled {
      color: var(--muted);
      cursor: not-allowed;
      opacity: .6;
    }

    /* duplicates */
    .dupgroup {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .dghead {
      font-size: 13px;
      margin-bottom: 10px;
    }

    .duprow {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .duptile {
      flex: none;
      width: 120px;
      cursor: pointer;
    }

    .duptile>img,
    .duptile>.ph {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid var(--line);
      background: var(--panel2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      color: var(--muted);
    }

    .duptile.kept>img,
    .duptile.kept>.ph {
      border-color: var(--good);
    }

    .dtcap {
      font-size: 11px;
      margin-top: 3px;
    }

    .dtcap .keep {
      color: var(--good);
      font-weight: 600;
    }

    .duptag {
      display: inline-block;
      border-radius: 9px;
      padding: 1px 6px;
      font-size: 10px;
      font-weight: 600;
    }

    .duptag.exact {
      background: #d9f7e6;
      color: #176b3a;
    }

    .duptag.visual {
      background: #e4e7ff;
      color: #414eaa;
    }

    .dtpath {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* faces / people */
    .people {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    }

    .pcard {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color .15s;
    }

    .pcard:hover {
      border-color: var(--accent);
    }

    .pcard .face {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      background: var(--panel2);
    }

    /* 2x2 face collage (person cards + review card) */
    .facecollage {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      aspect-ratio: 1;
      gap: 2px;
      background: var(--line);
      width: 100%;
    }

    .facecollage>img,
    .facecollage>.cempty {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: var(--panel2);
      min-width: 0;
      min-height: 0;
    }

    .pcard .pmeta {
      padding: 8px 10px;
    }

    .pcard .pname {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pcard .pname.un {
      color: var(--muted);
      font-weight: 400;
      font-style: italic;
    }

    .pcard .pcount {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .pet-species {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 10px;
      text-transform: capitalize;
    }

    .nonhuman-grid {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      margin-top: 12px
    }

    .nonhuman-card {
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel)
    }

    .nonhuman-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 7px;
      background: var(--panel2)
    }

    .nonhuman-actions {
      display: flex;
      gap: 6px;
      margin-top: 7px
    }

    .nonhuman-actions button {
      flex: 1;
      font-size: 11px
    }

    .place-gallery-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 24px 2px 12px;
    }

    .place-gallery-head h3 {
      margin: 0;
      font-size: 18px;
    }

    .placecollage {
      width: 100%;
      aspect-ratio: 1;
      background: var(--panel2);
      overflow: hidden;
    }

    .placecollage>.cgrid {
      width: 100%;
      height: 100%;
    }

    .placecollage>.placeempty {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      color: var(--muted);
      font-size: 30px;
    }

    /* "Same person?" review card, shown above the people grid */
    .suggest {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 18px;
      max-width: 520px;
    }

    .suggest .sug-head {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .suggest .sug-head .muted {
      font-weight: 400;
    }

    .suggest .sug-pair {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .suggest .sug-face {
      flex: 1;
      max-width: 180px;
      text-align: center;
    }

    .suggest .sug-face>img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 10px;
      background: var(--panel2);
      display: block;
    }

    .suggest .sug-face .facecollage {
      border-radius: 10px;
      overflow: hidden;
    }

    .suggest .sug-lbl {
      font-size: 13px;
      font-weight: 600;
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .suggest .sug-cnt {
      font-size: 11px;
      color: var(--muted);
    }

    .suggest .sug-q {
      flex: none;
      font-size: 26px;
      color: var(--muted);
    }

    .suggest .sug-btns {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .suggest .sug-btns button {
      flex: 1;
      padding: 9px 0;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--fg);
      font-size: 13px;
      cursor: pointer;
      transition: all .12s;
    }

    .suggest .sug-yes {
      border-color: var(--accent) !important;
    }

    .suggest .sug-yes:hover {
      background: var(--accent);
      color: #fff;
    }

    .suggest .sug-no:hover,
    .suggest .sug-skip:hover {
      border-color: var(--muted);
    }

    .suggest .sug-extra {
      margin-top: 10px;
      text-align: center;
    }

    .suggest .sug-extra button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      padding: 4px;
    }

    .suggest .sug-extra button:hover {
      color: var(--fg);
      text-decoration: underline;
    }

    /* person detail: a sticky topbar keeps back-nav + name reachable while the
     photo grid below (often thousands of tiles) scrolls out of view. */
    .facetopbar {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--bg);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .facetopbar .back {
      flex: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 13px;
    }

    .facetopbar .back:hover {
      text-decoration: underline;
    }

    .facetopbar .ftb-name {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .facetopbar .ftb-name .nm {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .facetopbar .ftb-name .nm.un {
      color: var(--muted);
      font-weight: 400;
      font-style: italic;
    }

    .facetopbar .ftb-count {
      flex: none;
      font-size: 12px;
    }

    .soonbox {
      padding: 50px;
      text-align: center;
      color: var(--muted);
    }

    .soonbox .big {
      font-size: 40px;
      margin-bottom: 10px;
    }

    /* modal */
    .modal {
      position: fixed;
      inset: 0;
      background: #000d;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .modal.open {
      display: flex;
    }

    .viewer {
      display: flex;
      max-width: 96vw;
      max-height: 94vh;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }

    .viewer .media {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 74vw;
    }

    .viewer .media img,
    .viewer .media video {
      max-width: 74vw;
      max-height: 94vh;
      object-fit: contain;
    }

    .viewer .info {
      width: 320px;
      flex: none;
      padding: 16px;
      overflow: auto;
      max-height: 94vh;
    }

    .viewer .info h3 {
      margin: 0 0 10px;
      font-size: 14px;
      word-break: break-all;
    }

    .kv {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 0;
      border-bottom: 1px solid var(--line);
      font-size: 12.5px;
    }

    .kv .k {
      color: var(--muted);
    }

    .kv .v {
      text-align: right;
      word-break: break-word;
    }

    /* editable detail sections */
    .isec {
      margin-top: 16px;
    }

    .isec>.h {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .isec>.h .linkbtn {
      margin-left: auto;
    }

    .facelist {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .facerow {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .facecrop {
      width: 46px;
      height: 46px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--panel2);
      flex: none;
      border: 1px solid var(--line);
    }

    .facerow .fsel {
      flex: 1;
      min-width: 0;
      max-width: none;
      padding: 6px 8px;
      font-size: 12.5px;
    }

    .info .fsel {
      max-width: none;
      width: 100%;
    }

    .dtrow {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .dtrow input {
      flex: 1;
      min-width: 0;
      padding: 7px 8px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      font: inherit;
      font-size: 12.5px;
    }

    .dtrow .yr {
      flex: 1.8;
    }

    .placepick {
      height: 190px;
      border-radius: 8px;
      overflow: hidden;
      margin: 8px 0;
      border: 1px solid var(--line);
    }

    .btnrow {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .val {
      font-size: 13px;
      word-break: break-word;
    }

    .close {
      position: absolute;
      top: 14px;
      right: 18px;
      font-size: 26px;
      color: #fff;
      cursor: pointer;
      z-index: 21;
    }

    /* transient, non-blocking notice (used when an optimistic save is rolled back) */
    #toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%) translateY(8px);
      z-index: 40;
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 10px 16px;
      border-radius: 9px;
      font-size: 13px;
      max-width: 80vw;
      box-shadow: 0 8px 24px #0009;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s, transform .18s;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #toast.err {
      border-color: #c0504d;
    }

    /* Step 2 — COA Noir archive system.  These overrides intentionally retain
     the small, dependency-free application while replacing the old dashboard
     visual language. */
    :root {
      --asphalt: #0E0E0E;
      --charcoal: #141414;
      --surface: #1C1C1C;
      --surface2: #252525;
      --parchment: #F0EAD6;
      --parchment-muted: #A89E8A;
      --parchment-faint: #3A352C;
      --accent: #B5614A;
      --accent-dim: #6B3828;
      --accent-rgb: 181, 97, 74;
      --tungsten: #E8A842;
      --crimson: #8B2E2E;
      --bg: var(--asphalt);
      --panel: var(--surface);
      --panel2: var(--surface2);
      --line: var(--parchment-faint);
      --text: var(--parchment);
      --muted: var(--parchment-muted);
      --good: #b8c47b;
      --focus: var(--tungsten);
      --space-1: 6px;
      --space-2: 10px;
      --space-3: 16px;
      --space-4: 24px;
      --space-5: 36px;
    }

    body {
      font: 14px/1.5 "JetBrains Mono", "Courier New", monospace;
      background: var(--asphalt);
    }

    body:before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .025;
      z-index: 50;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
    }

    h1,
    h2,
    h3,
    .display {
      font-family: "Playfair Display", Georgia, serif;
      letter-spacing: -.02em;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .btn {
      border-radius: 0;
      background: var(--accent);
      color: var(--parchment);
      padding: 9px 14px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .btn:hover {
      background: #ce755b
    }

    .btn.sec {
      background: transparent;
      border-color: var(--parchment-faint)
    }

    #picker {
      max-width: 1100px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 48px 30px;
    }

    .welcome {
      max-width: 700px
    }

    .welcome .eyebrow,
    .eyebrow {
      color: var(--accent);
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .welcome h1 {
      font-size: clamp(42px, 7vw, 78px);
      line-height: .95;
      margin: 12px 0 18px;
    }

    .welcome .sub {
      font-family: "Newsreader", Georgia, serif;
      font-size: 21px;
      max-width: 650px;
    }

    .setup-form {
      display: flex;
      gap: 8px;
      margin: 28px 0 14px;
      max-width: 660px
    }

    .setup-form input {
      min-width: 0;
      flex: 1;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: var(--surface);
      color: var(--text)
    }

    .privacy-note {
      font-family: "Newsreader", Georgia, serif;
      color: var(--muted);
      max-width: 680px
    }

    .archive-list-title {
      margin-top: 42px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--muted)
    }

    .card {
      border-radius: 0;
      background: var(--surface);
      border-color: var(--line);
    }

    .card:hover {
      border-color: var(--accent)
    }

    .card.add {
      min-height: 80px;
      border-radius: 0
    }

    .remove-archive {
      border-radius: 0;
      color: #e59585;
      border-color: var(--accent-dim)
    }

    #app.on {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      min-height: 100vh;
    }

    nav {
      width: auto;
      background: var(--charcoal);
      border-right-color: var(--accent-dim);
      padding: 18px 10px;
      height: 100vh;
    }

    nav .brand {
      font-family: "Bebas Neue", Impact, sans-serif;
      font-size: 22px;
      letter-spacing: .09em;
      border-top: 1px solid var(--accent);
      border-bottom: 1px solid var(--accent-dim);
      padding: 9px 8px 12px;
    }

    nav .arch {
      font-family: "Newsreader", Georgia, serif;
      border-bottom-color: var(--line);
      padding-bottom: 16px
    }

    .navitem {
      border-radius: 4px;
      font-family: "Bebas Neue", Impact, sans-serif;
      letter-spacing: .08em;
      font-size: 15px;
      padding: 10px;
      position: relative;
    }

    .navitem {
      border: 1px solid transparent;
      background: transparent;
      color: var(--parchment)
    }

    .navitem:hover {
      background: var(--surface2);
      color: var(--parchment)
    }

    .navitem.active {
      background: linear-gradient(90deg, var(--accent-dim), transparent);
      border-color: var(--accent-dim);
      color: var(--parchment)
    }

    .navitem.active:before {
      content: "";
      position: absolute;
      left: 0;
      top: 5px;
      bottom: 5px;
      width: 2px;
      background: var(--accent)
    }

    .gstat {
      border-top-color: var(--accent-dim)
    }

    main {
      height: auto;
      min-height: 100vh;
      padding: 34px 42px 60px;
      overflow: visible;
    }

    h2.sec {
      font-size: 34px;
      font-weight: 500;
      margin-bottom: 22px;
    }

    .panel,
    .stat,
    .dupgroup,
    .pcard,
    .suggest {
      border-radius: 0;
      border-color: var(--line);
      box-shadow: none
    }

    .panel {
      padding: 18px;
      background: var(--surface)
    }

    .stat {
      background: transparent;
      padding: 12px
    }

    .stat .k,
    .isec>.h {
      color: var(--muted)
    }

    .grid {
      gap: 4px;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    }

    .tile {
      border-radius: 0;
      border: 0;
      background: var(--surface2)
    }

    .tile:hover {
      outline: 2px solid var(--accent);
      outline-offset: -2px
    }

    .tile .cap {
      font-size: 10px
    }

    .date-heading {
      grid-column: 1/-1;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 28px;
      padding: 30px 0 5px;
      border-bottom: 1px solid var(--accent-dim)
    }

    .fsel {
      border-radius: 0;
      background: var(--surface);
      border-color: var(--line)
    }

    .filterbar {
      border-top: 1px solid var(--accent-dim);
      padding-top: 12px
    }

    .chips {
      font-size: 11px
    }

    .linkbtn {
      color: var(--tungsten)
    }

    .library-search {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      padding: 12px 14px;
      margin-bottom: 16px;
      border: 1px solid var(--line);
      background: linear-gradient(135deg, var(--surface), #191816)
    }

    .library-search input {
      flex: 1;
      min-width: 220px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: var(--asphalt);
      color: var(--text);
      font: inherit;
    }

    .library-search input::placeholder {
      color: var(--muted);
      opacity: .8
    }

    .library-search input:focus {
      outline: none;
      border-color: var(--tungsten)
    }

    .library-search .search-note {
      width: 100%;
      font-size: 11px;
      color: var(--muted)
    }

    .modal {
      background: #000e
    }

    .viewer {
      max-width: 100vw;
      max-height: 100vh;
      border: 0;
      border-radius: 0;
      background: var(--asphalt)
    }

    .viewer .media {
      max-width: calc(100vw - 370px);
    }

    .viewer .media img,
    .viewer .media video {
      max-width: calc(100vw - 370px);
      max-height: 100vh
    }

    .viewer .info {
      width: 370px;
      max-height: 100vh;
      background: var(--surface);
      padding: 24px
    }

    .close {
      color: var(--parchment)
    }

    @media(max-width:800px) {
      #app.on {
        display: block
      }

      nav {
        position: sticky;
        width: 100%;
        height: auto;
        z-index: 10;
        flex-direction: row;
        align-items: center;
        padding: 8px;
        overflow: auto
      }

      nav .brand {
        border: 0;
        padding: 3px 8px
      }

      .back,
      .arch,
      .gstat {
        display: none !important
      }

      #navitems {
        display: flex;
        gap: 2px
      }

      .navitem {
        white-space: nowrap;
        padding: 7px 8px
      }

      .navitem span:first-child {
        display: none
      }

      main {
        padding: 24px 16px
      }

      .setup-form {
        flex-direction: column
      }

      .viewer {
        align-self: stretch
      }

      .viewer .media,
      .viewer .media img,
      .viewer .media video {
        max-width: 100vw
      }

      .viewer .info {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 100%;
        max-height: 42vh;
        border-top: 1px solid var(--line)
      }
    }

    @media(prefers-reduced-motion:reduce) {

      *,
      *:before,
      *:after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important
      }
    }

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>organize_archive</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#14161a">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/vendor/leaflet.css">
<script src="/vendor/leaflet.js"></script>
<script>
  if ("serviceWorker" in navigator)
    window.addEventListener("load", () =>
      navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script>
<style>
  :root{--bg:#14161a;--panel:#1c1f26;--panel2:#252a33;--line:#2e343f;
    --text:#e7e9ee;--muted:#9aa3b2;--accent:#5b9dff;--accent2:#3a7bd5;--good:#57c98b;}
  *{box-sizing:border-box;}
  body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);}
  a{color:var(--accent);text-decoration:none;}
  button{font:inherit;}
  .btn{background:var(--accent2);color:#fff;border:none;border-radius:8px;
    padding:9px 16px;cursor:pointer;}
  .btn:hover{background:var(--accent);}
  .btn.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line);}
  .btn:disabled{opacity:.5;cursor:default;}
  .muted{color:var(--muted);}

  /* ---- archive picker ---- */
  #picker{max-width:900px;margin:0 auto;padding:40px 20px;}
  #picker h1{font-size:22px;margin:0 0 4px;}
  #picker .sub{color:var(--muted);margin-bottom:26px;}
  .cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;cursor:pointer;transition:border-color .15s;}
  .card:hover{border-color:var(--accent);}
  .card h3{margin:0 0 4px;font-size:15px;word-break:break-word;}
  .card .path{font-size:11px;color:var(--muted);word-break:break-all;margin-bottom:10px;}
  .card .stats{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
  .card.add{display:flex;align-items:center;justify-content:center;border-style:dashed;
    color:var(--muted);font-size:15px;min-height:120px;}
  .badge-warn{color:#e6b45e;font-size:11px;}

  /* ---- app shell ---- */
  #app{display:none;}
  #app.on{display:flex;min-height:100vh;}
  nav{width:210px;flex:none;background:var(--panel);border-right:1px solid var(--line);
    padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto;}
  nav .brand{display:flex;align-items:center;gap:8px;font-weight:600;padding:4px 8px 12px;}
  nav .back{font-size:12px;color:var(--muted);cursor:pointer;display:block;padding:4px 8px;margin-bottom:8px;}
  nav .arch{font-size:13px;padding:4px 8px 12px;border-bottom:1px solid var(--line);
    margin-bottom:8px;word-break:break-word;}
  .navitem{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
    cursor:pointer;color:var(--text);font-size:13.5px;}
  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:var(--accent2);color:#fff;}
  .navitem.soon{color:var(--muted);cursor:default;}
  .navitem .tag{margin-left:auto;font-size:9px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px;}
  main{flex:1;padding:22px 26px;max-width:100%;overflow:auto;height:100vh;}
  h2.sec{margin:0 0 16px;font-size:17px;}

  .statrow{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:20px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;}
  .stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);}
  .stat .v{font-size:22px;font-weight:600;margin-top:4px;}
  .stat .v small{font-size:12px;font-weight:400;color:var(--muted);}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:20px;}
  .panel h3{margin:0 0 12px;font-size:14px;}
  table.types{width:100%;border-collapse:collapse;font-size:13px;}
  table.types td{padding:6px 4px;border-bottom:1px solid var(--line);}
  table.types td.bar{width:45%;}
  .barwrap{background:var(--panel2);border-radius:5px;height:10px;overflow:hidden;}
  .barfill{height:100%;background:var(--accent);}
  .num{text-align:right;font-variant-numeric:tabular-nums;}

  /* tasks */
  .taskcard{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line);}
  .taskcard:last-child{border-bottom:none;}
  .taskcard .ico{font-size:20px;width:26px;text-align:center;flex:none;}
  .taskcard .body{flex:1;min-width:0;}
  .taskcard .t{font-weight:600;font-size:13.5px;}
  .taskcard .d{font-size:12px;color:var(--muted);margin-top:2px;}
  .taskcard .d.pending{color:#e6b45e;}
  .taskcard .d.ok{color:var(--good);}
  .taskcard .act{flex:none;}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle;}
  .dot.ok{background:var(--good);} .dot.pending{background:#e6b45e;} .dot.check{background:var(--muted);}
  .linkbtn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:12.5px;padding:6px 0;}
  .linkbtn:hover{text-decoration:underline;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);
    border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-right:6px;vertical-align:middle;}
  .job{margin-top:12px;font-size:13px;}
  .progress{background:var(--panel2);border-radius:6px;height:14px;overflow:hidden;margin:6px 0;}
  .progfill{height:100%;background:var(--good);width:0;transition:width .3s;}
  .job .cur{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  canvas{max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;}

  /* map markers */
  .mk{width:44px;height:44px;border-radius:8px;overflow:hidden;border:2px solid #fff;
    box-shadow:0 2px 6px #0008;background:var(--panel2);cursor:pointer;}
  .mk img{width:100%;height:100%;object-fit:cover;display:block;}
  .mk.mk-ph{display:flex;align-items:center;justify-content:center;}
  .mk.mk-ph::after{content:"📍";font-size:20px;}
  .mk-cluster{position:relative;width:50px;height:50px;border-color:var(--accent);}
  .mk-cluster span{position:absolute;top:-8px;right:-8px;background:var(--accent2);color:#fff;
    font-size:11px;font-weight:700;border-radius:11px;min-width:22px;height:22px;padding:0 5px;
    display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);}
  .leaflet-container{background:#11141a;font:inherit;}

  /* grid */
  .grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}
  .tile{position:relative;aspect-ratio:1;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .tile img{width:100%;height:100%;object-fit:cover;}
  .tile .ph{font-size:32px;color:var(--muted);}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-size:10px;color:#eef;
    background:linear-gradient(transparent,#000a);display:flex;justify-content:space-between;}
  .tile .badge{position:absolute;top:5px;right:6px;font-size:12px;text-shadow:0 1px 2px #000;}
  .more{text-align:center;margin:16px;}
  .chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer;}
  .chip button{all:unset;margin-left:6px;color:var(--muted);cursor:pointer;}

  .soonbox{padding:50px;text-align:center;color:var(--muted);}
  .soonbox .big{font-size:40px;margin-bottom:10px;}

  /* modal */
  .modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:20;}
  .modal.open{display:flex;}
  .viewer{display:flex;max-width:96vw;max-height:94vh;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .viewer .media{background:#000;display:flex;align-items:center;justify-content:center;max-width:74vw;}
  .viewer .media img,.viewer .media video{max-width:74vw;max-height:94vh;object-fit:contain;}
  .viewer .info{width:290px;flex:none;padding:16px;overflow:auto;max-height:94vh;}
  .viewer .info h3{margin:0 0 10px;font-size:14px;word-break:break-all;}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .kv .k{color:var(--muted);}
  .kv .v{text-align:right;word-break:break-word;}
  .close{position:absolute;top:14px;right:18px;font-size:26px;color:#fff;cursor:pointer;z-index:21;}
</style>
</head>
<body>

<!-- ARCHIVE PICKER -->
<div id="picker">
  <h1>organize_archive</h1>
  <div class="sub">Select an archive, or add a directory to catalog.</div>
  <div class="cards" id="archcards"></div>
</div>

<!-- APP SHELL -->
<div id="app">
  <nav>
    <div class="brand"><img src="/icon-192.png" width="22" height="22" style="border-radius:5px"> organize_archive</div>
    <span class="back" onclick="toPicker()">← all archives</span>
    <div class="arch" id="archname"></div>
    <div id="navitems"></div>
  </nav>
  <main id="main"></main>
</div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="if(event.target.id==='modal')closeModal()">
  <span class="close" onclick="closeModal()">×</span>
  <div class="viewer"><div class="media" id="mmedia"></div><div class="info" id="minfo"></div></div>
</div>

<script>
const TYPE_ICON={image:"🖼️",video:"🎞️",audio:"🎵",document:"📄",archive:"🗜️",other:"📦"};
const SECTIONS=[
  {id:"overview",label:"Overview",icon:"📊"},
  {id:"timeline",label:"Timeline",icon:"📈"},
  {id:"map",label:"Map",icon:"🗺️"},
  {id:"photos",label:"Browse",icon:"🖼️"},
  {id:"faces",label:"Faces",icon:"🙂",soon:true},
  {id:"places",label:"Places",icon:"📍",soon:true},
  {id:"situations",label:"Situations",icon:"🔎",soon:true},
];
const S={arch:null, section:"overview", grid:{offset:0,year:null,month:null,type:null}, poll:null};

function fmtBytes(n){if(n==null)return "—";const u=["B","KB","MB","GB","TB"];let i=0,f=n;
  while(f>=1024&&i<4){f/=1024;i++;}return f.toFixed(1)+" "+u[i];}
async function jget(u){return (await fetch(u)).json();}
async function jpost(u,b){return (await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})})).json();}

/* ---------- picker ---------- */
let ARCHIVES=[];
async function loadPicker(){
  const {archives}=await jget("/api/archives"); ARCHIVES=archives;
  const el=document.getElementById("archcards"); el.innerHTML="";
  archives.forEach(a=>{
    const c=document.createElement("div"); c.className="card"; c.onclick=()=>openArchive(a);
    const warn=a.exists?"":'<span class="badge-warn">⚠ not mounted</span>';
    const enr=a.enriched<a.files?`<span class="badge-warn">${(a.files-a.enriched).toLocaleString()} not enriched</span>`:"";
    c.innerHTML=`<h3>${a.name} ${warn}</h3><div class="path">${a.path}</div>
      <div class="stats"><span>${a.files.toLocaleString()} files</span>
      <span>${fmtBytes(a.size)}</span>${enr}</div>`;
    el.appendChild(c);
  });
  const add=document.createElement("div"); add.className="card add";
  add.innerHTML="+ Add directory"; add.onclick=addArchive; el.appendChild(add);
}
async function addArchive(){
  const p=prompt("Full path to the directory to catalog:");
  if(!p)return;
  const r=await jpost("/api/archives",{path:p});
  if(r.error){alert(r.error);return;}
  loadPicker();
}

/* ---------- archive shell ---------- */
function openArchive(a,section){
  S.arch=a; S.section=section||"overview";
  document.getElementById("picker").style.display="none";
  document.getElementById("app").classList.add("on");
  document.getElementById("archname").textContent=a.name;
  location.hash=`/archive/${a.id}/${S.section}`;
  renderNav(); showSection(S.section);
}
function applyHash(){
  const m=(location.hash||"").match(/#\/archive\/(\d+)\/(\w+)/);
  if(m){const a=ARCHIVES.find(x=>x.id==+m[1]); if(a){openArchive(a,m[2]);return true;}}
  return false;
}
function toPicker(){
  stopPoll(); S.arch=null;
  document.getElementById("app").classList.remove("on");
  document.getElementById("picker").style.display="block";
  loadPicker();
}
function renderNav(){
  const el=document.getElementById("navitems"); el.innerHTML="";
  SECTIONS.forEach(s=>{
    const d=document.createElement("div");
    d.className="navitem"+(s.soon?" soon":"")+(s.id===S.section?" active":"");
    d.innerHTML=`<span>${s.icon}</span><span>${s.label}</span>`+(s.soon?'<span class="tag">soon</span>':"");
    if(!s.soon)d.onclick=()=>showSection(s.id);
    el.appendChild(d);
  });
}
function showSection(id){
  if(id!=="map" && MAP){MAP.remove();MAP=null;MAP_LAYER=null;}
  S.section=id; renderNav(); stopPoll();
  if(S.arch)location.hash=`/archive/${S.arch.id}/${id}`;
  const m=document.getElementById("main");
  if(id==="overview")return renderOverview(m);
  if(id==="timeline")return renderTimeline(m);
  if(id==="map")return renderMap(m);
  if(id==="photos")return renderPhotos(m);
  return renderSoon(m,id);
}

/* ---------- overview + tasks ---------- */
async function renderOverview(m){
  const root=S.arch.id;
  const s=await jget("/api/summary?root="+root);
  const need=s.enriched<s.total;
  m.innerHTML=`<h2 class="sec">Overview — ${S.arch.name}</h2>
    <div class="statrow">
      <div class="stat"><div class="k">Files</div><div class="v">${s.total.toLocaleString()}</div></div>
      <div class="stat"><div class="k">Total size</div><div class="v">${fmtBytes(s.size)}</div></div>
      <div class="stat"><div class="k">With location</div><div class="v">${s.with_gps.toLocaleString()}</div></div>
      <div class="stat"><div class="k">Dated</div><div class="v">${s.enriched.toLocaleString()} <small>/ ${s.total.toLocaleString()}</small></div></div>
      <div class="stat"><div class="k">Date range</div><div class="v" style="font-size:14px">${(s.date_min||"—").slice(0,10)}<br>${(s.date_max||"—").slice(0,10)}</div></div>
    </div>
    <div class="panel"><h3>Tasks</h3>
      <div id="taskcards">
        <div class="taskcard" id="task-scan"></div>
        <div class="taskcard" id="task-enrich"></div>
      </div>
      <div id="jobarea"></div>
    </div>
    <div class="panel"><h3>By type</h3><table class="types" id="typetbl"></table></div>`;
  const tbl=document.getElementById("typetbl");
  const max=Math.max(...s.types.map(t=>t.size),1);
  s.types.forEach(t=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${TYPE_ICON[t.type]||"📦"} ${t.type}</td>
      <td class="num">${t.count.toLocaleString()}</td>
      <td class="bar"><div class="barwrap"><div class="barfill" style="width:${100*t.size/max}%"></div></div></td>
      <td class="num">${fmtBytes(t.size)}</td>`;
    tbl.appendChild(tr);
  });
  S.summary=s;
  renderTaskCards();
  refreshJobs();
}

// Task-card state. Uses instant DB counts; the disk walk only runs when the
// user explicitly checks for new files.
function taskCardHTML(kind, running){
  const s=S.summary||{total:0,enriched:0}, f=S.fresh, ic=kind==="scan"?"🔎":"✦";
  const title=kind==="scan"?"Scan files":"Extract dates, places & metadata";
  if(running)
    return card(ic,title,`<span class="spin"></span>Working…`,"","");
  if(kind==="scan"){
    let desc, action;
    if(f && f.checking){ desc=`<span class="spin"></span>Checking the folder…`; action=""; }
    else if(f && f.new_files>0){
      desc=`<span class="dot pending"></span>${f.new_files.toLocaleString()} new files found`;
      action=btn("Scan new files",`runTask('scan')`,false);
    } else {
      desc=`<span class="dot ok"></span>${s.total.toLocaleString()} files indexed`
        + (f&&f.checked?` <span class="muted">· no new files</span>`:"");
      action=`<button class="linkbtn" onclick="checkNewFiles()">Check for new files</button>`;
    }
    return card(ic,title,desc,f&&f.new_files>0?"pending":"ok",action);
  } else {
    const need=s.total-s.enriched;
    if(!s.total) return card(ic,title,`<span class="dot check"></span>Scan first`,"","");
    if(need>0)
      return card(ic,title,`<span class="dot pending"></span>${need.toLocaleString()} files need dates & places`,"pending",
        btn("Extract now",`runTask('enrich')`,false));
    return card(ic,title,`<span class="dot ok"></span>Dates, places & metadata complete`,"ok","");
  }
}
function card(ico,title,desc,cls,action){
  return `<div class="ico">${ico}</div><div class="body"><div class="t">${title}</div>
    <div class="d ${cls}">${desc}</div></div><div class="act">${action}</div>`;
}
function btn(label,onclick,secondary){
  return `<button class="btn ${secondary?'sec':''}" onclick="${onclick}">${label}</button>`;
}
function renderTaskCards(){
  const active=S.activeJobs||{};
  const cs=document.getElementById("task-scan"), ce=document.getElementById("task-enrich");
  if(cs)cs.innerHTML=taskCardHTML("scan",!!active.scan);
  if(ce)ce.innerHTML=taskCardHTML("enrich",!!active.enrich);
}
async function checkNewFiles(){
  S.fresh={checking:true}; renderTaskCards();
  try{
    const r=await jget("/api/freshness?root="+S.arch.id);
    S.fresh={checked:true,new_files:r.new_files||0};
  }catch(e){ S.fresh={checked:true,new_files:0}; }
  renderTaskCards();
}
async function runTask(kind){
  const r=await jpost("/api/task",{kind:kind,root_id:S.arch.id});
  if(r.error){alert(r.error);return;}
  startPoll();
}
async function refreshJobs(){
  const area=document.getElementById("jobarea"); if(!area)return;
  const {jobs}=await jget("/api/jobs?root="+S.arch.id);
  const active=jobs.filter(j=>j.status==="running");
  S.activeJobs={scan:active.some(j=>j.kind==="scan"),enrich:active.some(j=>j.kind==="enrich")};
  renderTaskCards();
  area.innerHTML="";
  active.forEach(j=>{
    const pct=j.percent!=null?j.percent:0;
    const div=document.createElement("div"); div.className="job";
    div.innerHTML=`<div class="progress"><div class="progfill" style="width:${pct}%"></div></div>
      <div class="cur">${j.kind}: ${pct}% · ${j.done.toLocaleString()}${j.total?"/"+j.total.toLocaleString():""} · ${j.elapsed}s${j.current?" · "+j.current:""}</div>`;
    area.appendChild(div);
  });
  if(!active.length){
    stopPoll();
    if(jobs.length && (jobs[0].status==="done"||jobs[0].status==="cancelled")){
      loadFreshness();
      if(S.section==="overview")renderOverview(document.getElementById("main"));
    }
  }
}
function startPoll(){stopPoll(); S.poll=setInterval(refreshJobs,1200); refreshJobs();}
function stopPoll(){if(S.poll){clearInterval(S.poll);S.poll=null;}}

/* ---------- timeline ---------- */
const TL_COL={image:"#5b9dff",video:"#c77dff",audio:"#57c98b",document:"#e6b45e",archive:"#9aa3b2",other:"#8b93a3"};
async function renderTimeline(m){
  m.innerHTML=`<h2 class="sec">Timeline</h2>
    <div class="chips"><span class="chip" id="tl-month" onclick="drawTimeline('month')">By month</span>
      <span class="chip" id="tl-year" onclick="drawTimeline('year')">By year</span></div>
    <div id="tllegend" style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:8px;font-size:12px"></div>
    <canvas id="tlc" width="1180" height="380"></canvas>
    <div class="muted" style="margin-top:8px;font-size:12px">Photos, videos and audio per period on a shared scale. Totals are in the legend.</div>`;
  drawTimeline("month");
}
function monotonePath(ctx,xs,ys){
  // Fritsch-Carlson monotone cubic: smooth but never overshoots the data,
  // so a line can't dip below zero or spike between points.
  const n=xs.length;
  if(n===1){return;}
  const dx=[],slope=[];
  for(let i=0;i<n-1;i++){dx[i]=xs[i+1]-xs[i];slope[i]=(ys[i+1]-ys[i])/dx[i];}
  const t=new Array(n); t[0]=slope[0]; t[n-1]=slope[n-2];
  for(let i=1;i<n-1;i++) t[i]=(slope[i-1]*slope[i]<=0)?0:(slope[i-1]+slope[i])/2;
  for(let i=0;i<n-1;i++){
    if(slope[i]===0){t[i]=0;t[i+1]=0;continue;}
    const a=t[i]/slope[i], b=t[i+1]/slope[i], h=Math.hypot(a,b);
    if(h>3){const tau=3/h;t[i]=tau*a*slope[i];t[i+1]=tau*b*slope[i];}
  }
  ctx.moveTo(xs[0],ys[0]);
  for(let i=0;i<n-1;i++){
    const h=dx[i];
    ctx.bezierCurveTo(xs[i]+h/3, ys[i]+t[i]*h/3, xs[i+1]-h/3, ys[i+1]-t[i+1]*h/3, xs[i+1], ys[i+1]);
  }
}
function niceMax(v){
  if(v<=5)return 5;
  const p=Math.pow(10,Math.floor(Math.log10(v)));
  for(const m of [1,2,2.5,5,10]) if(v<=m*p)return m*p;
  return 10*p;
}
async function drawTimeline(bucket){
  document.getElementById("tl-month").style.background=bucket==="month"?"var(--accent2)":"";
  document.getElementById("tl-year").style.background=bucket==="year"?"var(--accent2)":"";
  const {series}=await jget(`/api/timeline?root=${S.arch.id}&bucket=${bucket}`);
  const cv=document.getElementById("tlc"); if(!cv)return;
  const ctx=cv.getContext("2d"); const W=cv.width,H=cv.height,padL=54,padR=16,padT=18,padB=28;
  ctx.clearRect(0,0,W,H);
  const leg=document.getElementById("tllegend"); leg.innerHTML="";
  if(!series.length){leg.innerHTML='<span class="muted">No dated media yet, run Extract on the Overview tab.</span>';return;}
  const types=["image","video","audio"].filter(t=>series.some(s=>s[t]));
  const n=series.length;
  const gmax=niceMax(Math.max(...series.flatMap(s=>types.map(t=>s[t]||0)),1));
  const X=i=> padL + (n===1?(W-padL-padR)/2 : i*(W-padL-padR)/(n-1));
  const Y=v=> H-padB - v/gmax*(H-padT-padB);
  ctx.font="10px system-ui"; ctx.textAlign="right"; ctx.textBaseline="middle";
  for(let g=0;g<=4;g++){
    const val=gmax*g/4, y=Y(val);
    ctx.strokeStyle=g===0?"#3a414e":"#232833"; ctx.beginPath();
    ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillStyle="#9aa3b2"; ctx.fillText(Math.round(val).toLocaleString(),padL-8,y);
  }
  const ordered=types.slice().sort((a,b)=>
    series.reduce((x,s)=>x+(s[b]||0),0)-series.reduce((x,s)=>x+(s[a]||0),0));
  ordered.forEach(t=>{
    const xs=series.map((s,i)=>X(i)), ys=series.map(s=>Y(s[t]||0));
    if(n===1){ctx.fillStyle=TL_COL[t];ctx.beginPath();ctx.arc(xs[0],ys[0],3,0,7);ctx.fill();return;}
    ctx.beginPath(); monotonePath(ctx,xs,ys);
    ctx.lineTo(xs[n-1],H-padB); ctx.lineTo(xs[0],H-padB); ctx.closePath();
    ctx.fillStyle=TL_COL[t]+"1e"; ctx.fill();
    ctx.beginPath(); monotonePath(ctx,xs,ys);
    ctx.strokeStyle=TL_COL[t]; ctx.lineWidth=2; ctx.lineJoin="round"; ctx.stroke();
  });
  ctx.fillStyle="#9aa3b2"; ctx.textAlign="center"; ctx.textBaseline="top";
  const step=Math.max(1,Math.ceil(n/12));
  series.forEach((s,i)=>{ if(i%step===0||i===n-1)ctx.fillText(s.period,X(i),H-padB+8); });
  types.forEach(t=>{
    const tot=series.reduce((a,s)=>a+(s[t]||0),0);
    const sp=document.createElement("span");
    sp.innerHTML=`<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${TL_COL[t]};margin-right:6px"></span>`+
      t+` <span class="muted">, ${tot.toLocaleString()}</span>`;
    leg.appendChild(sp);
  });
}

/* ---------- map (Leaflet: clustered thumbnails, optional basemap) ---------- */
let MAP=null, MAP_LAYER=null, MAP_TILES=null, MAP_PTS=[];
function basemapOn(){ return localStorage.getItem("basemap")!=="off"; }
async function renderMap(m){
  m.innerHTML=`<h2 class="sec">Map</h2>
    <div class="chips">
      <span class="muted" id="mapnote">Loading…</span>
      <label style="margin-left:auto;font-size:12px;cursor:pointer">
        <input type="checkbox" id="basemap" ${basemapOn()?"checked":""} onchange="toggleBasemap()"> Street map
      </label>
    </div>
    <div id="lmap" style="height:600px;border:1px solid var(--line);border-radius:10px;overflow:hidden"></div>
    <div class="muted" style="margin-top:8px;font-size:12px">Photos cluster by location — click a cluster to zoom in, a thumbnail to open it.
      <b>Street map</b> fetches map tiles online (only coordinates are sent — your photos never leave this machine).</div>`;
  if(MAP){MAP.remove();MAP=null;MAP_LAYER=null;}
  const {points}=await jget("/api/map?root="+S.arch.id);
  MAP_PTS=points;
  document.getElementById("mapnote").textContent=points.length
    ? `${points.length.toLocaleString()} geolocated items`
    : "No geolocated media yet — run Extract (needs GPS in Takeout or EXIF).";
  MAP=L.map("lmap",{worldCopyJump:true,attributionControl:false});
  applyBasemap();
  if(!points.length){ MAP.setView([0,0],2); return; }
  const b=L.latLngBounds(points.map(p=>[p.lat,p.lon]));
  MAP.fitBounds(b,{padding:[40,40],maxZoom:14});
  MAP.on("moveend zoomend",drawClusters);
  drawClusters();
}
function applyBasemap(){
  if(!MAP)return;
  if(basemapOn()){
    if(!MAP_TILES){
      MAP_TILES=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19});
    }
    MAP_TILES.addTo(MAP);
    document.getElementById("lmap").style.background="";
  }else if(MAP_TILES){
    MAP.removeLayer(MAP_TILES);
    document.getElementById("lmap").style.background="#11141a";
  }
}
function toggleBasemap(){
  localStorage.setItem("basemap",document.getElementById("basemap").checked?"on":"off");
  applyBasemap();
}
function drawClusters(){
  if(!MAP)return;
  if(MAP_LAYER)MAP.removeLayer(MAP_LAYER);
  MAP_LAYER=L.layerGroup().addTo(MAP);
  const R=54; // px cluster radius
  const bounds=MAP.getBounds(), buckets={};
  MAP_PTS.forEach(p=>{
    if(!bounds.contains([p.lat,p.lon]))return;
    const pt=MAP.latLngToContainerPoint([p.lat,p.lon]);
    const key=Math.round(pt.x/R)+"_"+Math.round(pt.y/R);
    (buckets[key]=buckets[key]||[]).push(p);
  });
  Object.values(buckets).forEach(grp=>{
    const lat=grp.reduce((a,p)=>a+p.lat,0)/grp.length;
    const lon=grp.reduce((a,p)=>a+p.lon,0)/grp.length;
    if(grp.length===1){
      const p=grp[0];
      const icon=L.divIcon({className:"",iconSize:[46,46],html:
        `<div class="mk"><img src="/thumb/${p.id}" loading="lazy" onerror="this.parentNode.classList.add('mk-ph');this.remove()"></div>`});
      L.marker([lat,lon],{icon}).addTo(MAP_LAYER).on("click",()=>openItem(p.id));
    }else{
      const p=grp[0];
      const icon=L.divIcon({className:"",iconSize:[52,52],html:
        `<div class="mk mk-cluster"><img src="/thumb/${p.id}" onerror="this.remove()"><span>${grp.length}</span></div>`});
      L.marker([lat,lon],{icon}).addTo(MAP_LAYER).on("click",()=>{
        MAP.flyToBounds(L.latLngBounds(grp.map(q=>[q.lat,q.lon])),{padding:[60,60],maxZoom:16});
      });
    }
  });
}

/* ---------- browse ---------- */
async function renderPhotos(m){
  S.grid={offset:0,year:null,month:null,type:null};
  m.innerHTML=`<h2 class="sec">Browse</h2><div class="chips" id="gchips"></div>
    <div class="grid" id="grid"></div><div class="more" id="gmore" style="display:none">
    <button class="btn sec" onclick="loadGrid()">Load more</button></div>`;
  loadGrid();
}
async function loadGrid(){
  const g=S.grid, p=new URLSearchParams({root:S.arch.id,offset:g.offset,limit:120});
  if(g.type)p.set("type",g.type); if(g.year)p.set("year",g.year);
  const res=await jget("/api/media?"+p);
  const grid=document.getElementById("grid");
  res.items.forEach(it=>grid.appendChild(tile(it)));
  g.offset+=res.count;
  document.getElementById("gmore").style.display=res.count>=120?"block":"none";
}
function tile(it){
  const d=document.createElement("div"); d.className="tile"; d.onclick=()=>openItem(it.id);
  if(it.type==="image"){const img=document.createElement("img");img.loading="lazy";
    img.src="/thumb/"+it.id;img.onerror=()=>img.replaceWith(ph("🖼️"));d.appendChild(img);}
  else d.appendChild(ph(TYPE_ICON[it.type]||"📦"));
  const cap=document.createElement("div");cap.className="cap";
  cap.innerHTML=`<span>${(it.date||"").slice(0,10)}</span><span>${it.type==="video"?"▶":""}</span>`;
  d.appendChild(cap);
  if(it.has_gps){const b=document.createElement("div");b.className="badge";b.textContent="📍";d.appendChild(b);}
  return d;
}
function ph(icon){const s=document.createElement("div");s.className="ph";s.textContent=icon;return s;}

function renderSoon(m,id){
  const S2={faces:["🙂","Faces","Detect and cluster people locally, then pick a person to see all their photos."],
    places:["📍","Places","Reverse-geocode coordinates into place names and browse by location."],
    situations:["🔎","Situations","Search by content — “beach sunset”, “birthday” — using local image embeddings."]}[id];
  m.innerHTML=`<h2 class="sec">${S2[1]}</h2><div class="soonbox"><div class="big">${S2[0]}</div>
    <p>${S2[2]}</p><p class="muted">Coming in a later phase.</p></div>`;
}

/* ---------- detail modal ---------- */
async function openItem(id){
  const it=await jget("/api/item/"+id);
  const m=document.getElementById("mmedia");
  if(it.type==="image")m.innerHTML=`<img src="/file/${id}">`;
  else if(it.type==="video")m.innerHTML=`<video src="/file/${id}" controls autoplay></video>`;
  else if(it.type==="audio")m.innerHTML=`<div style="padding:40px"><div class="ph" style="font-size:60px;text-align:center">🎵</div><audio src="/file/${id}" controls autoplay></audio></div>`;
  else m.innerHTML=`<div class="ph" style="font-size:70px;padding:60px">${TYPE_ICON[it.type]||"📦"}</div>`;
  const kv=(k,v)=>v!=null&&v!==""?`<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`:"";
  const dims=it.meta&&it.meta.width?`${it.meta.width}×${it.meta.height}`:"";
  const cam=it.meta&&it.meta.model?((it.meta.make||"")+" "+it.meta.model).trim():"";
  const gps=it.gps?`<a href="https://www.openstreetmap.org/?mlat=${it.gps.lat}&mlon=${it.gps.lon}&zoom=14" target="_blank">${it.gps.lat.toFixed(5)}, ${it.gps.lon.toFixed(5)}</a>`:"";
  document.getElementById("minfo").innerHTML=`<h3>${it.name}</h3>`+
    kv("Date",it.date?it.date.replace("T"," "):"—")+kv("Date source",it.date_source)+
    kv("Type",it.type)+kv("Size",fmtBytes(it.size))+kv("Dimensions",dims)+kv("Camera",cam)+
    kv("Location",gps)+kv("Description",it.description)+
    `<div class="kv"><span class="k">Path</span></div><div style="font-size:11px;color:var(--muted);word-break:break-all">${it.rel_path}</div>
     <div style="margin-top:12px"><a href="/file/${id}" target="_blank">Open original ↗</a></div>`;
  document.getElementById("modal").classList.add("open");
}
function closeModal(){document.getElementById("modal").classList.remove("open");
  document.getElementById("mmedia").innerHTML="";}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

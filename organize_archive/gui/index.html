<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>organize_archive</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#14161a">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/vendor/leaflet.css">
<script src="/vendor/leaflet.js"></script>
<script>
  if ("serviceWorker" in navigator)
    window.addEventListener("load", () =>
      navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script>
<style>
  :root{--bg:#14161a;--panel:#1c1f26;--panel2:#252a33;--line:#2e343f;
    --text:#e7e9ee;--muted:#9aa3b2;--accent:#5b9dff;--accent2:#3a7bd5;--good:#57c98b;}
  *{box-sizing:border-box;}
  body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);}
  a{color:var(--accent);text-decoration:none;}
  button{font:inherit;}
  .btn{background:var(--accent2);color:#fff;border:none;border-radius:8px;
    padding:9px 16px;cursor:pointer;}
  .btn:hover{background:var(--accent);}
  .btn.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line);}
  .btn:disabled{background:var(--panel2);color:var(--muted);border:1px solid var(--line);
    cursor:not-allowed;}
  .btn:disabled:hover{background:var(--panel2);}
  .muted{color:var(--muted);}

  /* ---- archive picker ---- */
  #picker{max-width:900px;margin:0 auto;padding:40px 20px;}
  #picker h1{font-size:22px;margin:0 0 4px;}
  #picker .sub{color:var(--muted);margin-bottom:26px;}
  .cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;cursor:pointer;transition:border-color .15s;}
  .card:hover{border-color:var(--accent);}
  .card h3{margin:0 0 4px;font-size:15px;word-break:break-word;}
  .card .path{font-size:11px;color:var(--muted);word-break:break-all;margin-bottom:10px;}
  .card .stats{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
  .card .cardfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;}
  .remove-archive{margin-left:auto;background:transparent;color:#df7773;border:1px solid #814845;
    border-radius:7px;padding:4px 8px;font-size:11px;cursor:pointer;}
  .remove-archive:hover{background:#542827;color:#fff;}
  .card.add{display:flex;align-items:center;justify-content:center;border-style:dashed;
    color:var(--muted);font-size:15px;min-height:120px;}
  .badge-warn{color:#e6b45e;font-size:11px;}

  /* ---- app shell ---- */
  #app{display:none;}
  #app.on{display:flex;min-height:100vh;}
  nav{width:210px;flex:none;background:var(--panel);border-right:1px solid var(--line);
    padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto;transition:width .15s;
    display:flex;flex-direction:column;}
  nav .brand{display:flex;align-items:center;gap:8px;font-weight:600;padding:4px 8px 12px;}
  nav .navtoggle{margin-left:auto;cursor:pointer;color:var(--muted);font-size:13px;
    padding:3px 6px;border-radius:5px;flex:none;}
  nav .navtoggle:hover{background:var(--panel2);color:var(--text);}
  nav .back{font-size:12px;color:var(--muted);cursor:pointer;display:block;padding:4px 8px;margin-bottom:8px;}
  nav .arch{font-size:13px;padding:4px 8px 12px;border-bottom:1px solid var(--line);
    margin-bottom:8px;word-break:break-word;}
  .navitem{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
    cursor:pointer;color:var(--text);font-size:13.5px;}
  .navitem:hover{background:var(--panel2);}
  .navitem.active{background:var(--accent2);color:#fff;}
  .navitem.soon{color:var(--muted);cursor:default;}
  .navitem .tag{margin-left:auto;font-size:9px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px;}

  /* Persistent pipeline status, pinned to the bottom of the sidebar so it is
     visible on every section (the app runs itself; this is the ambient bar). */
  .gstat{margin-top:auto;padding:9px 8px 2px;border-top:1px solid var(--line);
    display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);line-height:1.3;}
  .gstat .gtxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gstat .gpct{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--text);flex:none;}
  nav.collapsed .gstat{justify-content:center;padding:9px 0 2px;}
  nav.collapsed .gstat .gtxt,nav.collapsed .gstat .gpct{display:none;}

  nav.collapsed{width:56px;}
  nav.collapsed .brand{justify-content:center;}
  nav.collapsed .brandtxt,nav.collapsed .back,nav.collapsed .arch,
  nav.collapsed .navitem span:nth-of-type(2),nav.collapsed .navitem .tag{display:none;}
  nav.collapsed .navtoggle{margin-left:0;transform:scaleX(-1);}
  nav.collapsed .navitem{justify-content:center;padding:8px 4px;}
  main{flex:1;padding:22px 26px;max-width:100%;overflow:auto;height:100vh;}
  h2.sec{margin:0 0 16px;font-size:17px;}

  .statrow{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:20px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;}
  .stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);}
  .stat .v{font-size:22px;font-weight:600;margin-top:4px;}
  .stat .v small{font-size:12px;font-weight:400;color:var(--muted);}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:20px;}
  .panel h3{margin:0 0 12px;font-size:14px;}
  table.types{width:100%;border-collapse:collapse;font-size:13px;}
  table.types td{padding:6px 4px;border-bottom:1px solid var(--line);}
  .type-summary-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--panel2);}
  .type-summary-segment{min-width:0;transition:width .2s;}
  .type-summary-legend{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 8px;font-size:12px;}
  .type-summary-key{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;}
  .num{text-align:right;font-variant-numeric:tabular-nums;}

  /* tasks */
  .taskcard{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line);}
  .taskcard:last-child{border-bottom:none;}
  .taskcard .ico{font-size:20px;width:26px;text-align:center;flex:none;}
  .taskcard .body{flex:1;min-width:0;}
  .taskcard .t{font-weight:600;font-size:13.5px;}
  .taskcard .d{font-size:12px;color:var(--muted);margin-top:2px;}
  .taskcard .d.pending{color:#e6b45e;}
  .taskcard .d.ok{color:var(--good);}
  .taskcard .act{flex:none;}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle;}
  .dot.ok{background:var(--good);} .dot.pending{background:#e6b45e;} .dot.check{background:var(--muted);}
  .linkbtn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:12.5px;padding:6px 0;}
  .linkbtn:hover{text-decoration:underline;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);
    border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-right:6px;vertical-align:middle;}
  .job{margin-top:12px;font-size:13px;}
  .progress{background:var(--panel2);border-radius:6px;height:14px;overflow:hidden;margin:6px 0;}
  .progfill{height:100%;background:var(--good);width:0;transition:width .3s;}
  .job .cur{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  canvas{max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;}

  /* map markers */
  .mk{position:relative;width:44px;height:44px;border-radius:8px;overflow:hidden;border:2px solid #fff;
    box-shadow:0 2px 6px #0008;background:var(--panel2);cursor:pointer;}
  .mk img{width:100%;height:100%;object-fit:cover;display:block;}
  .mk.mk-ph{display:flex;align-items:center;justify-content:center;}
  .mk.mk-ph::after{content:"📍";font-size:20px;}
  .mk.mk-sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent),0 2px 6px #0008;}
  .mk-cluster{position:relative;width:50px;height:50px;border-color:var(--accent);}
  .mk-cluster span{position:absolute;top:-8px;right:-8px;background:var(--accent2);color:#fff;
    font-size:11px;font-weight:700;border-radius:11px;min-width:22px;height:22px;padding:0 5px;
    display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);}
  /* Leaflet's own panes/controls use z-index up to ~1000; without this the
     map isolates none of that and it renders on top of the modal (z-index:20). */
  .leaflet-container{background:#11141a;font:inherit;position:relative;z-index:0;}

  /* place-cluster collage marker: a small photo grid representing "the place" */
  .cgrid{display:grid;width:100%;height:100%;gap:1px;}
  .cgrid img{width:100%;height:100%;object-fit:cover;display:block;}
  .cgrid.n1{grid-template-columns:1fr;grid-template-rows:1fr;}
  .cgrid.n2{grid-template-columns:1fr 1fr;grid-template-rows:1fr;}
  .cgrid.n3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;}
  .cgrid.n3 img:first-child{grid-row:1/3;}
  .cgrid.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;}
  .mk-badge{position:absolute;top:-6px;right:-6px;background:var(--accent2);color:#fff;
    font-size:10px;font-weight:700;border-radius:9px;min-width:18px;height:18px;padding:0 4px;
    display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);}
  .leaflet-tooltip{background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:6px;font-size:11px;padding:2px 7px;box-shadow:0 2px 6px #0008;}
  .leaflet-tooltip-top:before{border-top-color:var(--panel);}

  /* map layout: map on the left, selected place's photos on the right */
  .mapwrap{display:flex;gap:14px;align-items:flex-start;}
  #lmap{flex:1;min-width:0;height:600px;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  #mapside{width:300px;flex:none;height:600px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:16px;overflow:auto;}
  #mapside .empty{color:var(--muted);text-align:center;padding:70px 10px;font-size:13px;}
  #mapside .mapside-name{display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:14px;font-weight:600;margin-bottom:4px;}
  @media (max-width:900px){.mapwrap{flex-direction:column;}#lmap,#mapside{width:100%;height:360px;}}

  /* grid */
  .grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}
  .tile{position:relative;aspect-ratio:1;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .tile img{width:100%;height:100%;object-fit:cover;}
  .tile .ph{font-size:32px;color:var(--muted);}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-size:10px;color:#eef;
    background:linear-gradient(transparent,#000a);display:flex;justify-content:space-between;}
  .tile .badge{position:absolute;top:5px;right:6px;font-size:12px;text-shadow:0 1px 2px #000;}
  .more{text-align:center;margin:16px;}
  .chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer;}
  .chip button{all:unset;margin-left:6px;color:var(--muted);cursor:pointer;}

  /* Browse filter bar */
  .filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  .fsel{background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:7px 10px;font:inherit;cursor:pointer;max-width:190px;}
  .fsel:hover{border-color:var(--accent);}
  .fsel:focus{outline:none;border-color:var(--accent);}
  .fsel:disabled{color:var(--muted);cursor:not-allowed;opacity:.6;}

  /* duplicates */
  .dupgroup{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;}
  .dghead{font-size:13px;margin-bottom:10px;}
  .duprow{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
  .duptile{flex:none;width:120px;cursor:pointer;}
  .duptile>img,.duptile>.ph{width:120px;height:120px;object-fit:cover;border-radius:8px;
    border:2px solid var(--line);background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--muted);}
  .duptile.kept>img,.duptile.kept>.ph{border-color:var(--good);}
  .dtcap{font-size:11px;margin-top:3px;}
  .dtcap .keep{color:var(--good);font-weight:600;}
  .duptag{display:inline-block;border-radius:9px;padding:1px 6px;font-size:10px;font-weight:600;}
  .duptag.exact{background:#d9f7e6;color:#176b3a;}
  .duptag.visual{background:#e4e7ff;color:#414eaa;}
  .dtpath{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* faces / people */
  .people{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));}
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;
    cursor:pointer;transition:border-color .15s;}
  .pcard:hover{border-color:var(--accent);}
  .pcard .face{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--panel2);}
  /* 2x2 face collage (person cards + review card) */
  .facecollage{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
    aspect-ratio:1;gap:2px;background:var(--line);width:100%;}
  .facecollage>img,.facecollage>.cempty{width:100%;height:100%;object-fit:cover;display:block;
    background:var(--panel2);min-width:0;min-height:0;}
  .pcard .pmeta{padding:8px 10px;}
  .pcard .pname{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pcard .pname.un{color:var(--muted);font-weight:400;font-style:italic;}
  .pcard .pcount{font-size:11px;color:var(--muted);margin-top:2px;}

  /* "Same person?" review card, shown above the people grid */
  .suggest{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin-bottom:18px;max-width:520px;}
  .suggest .sug-head{font-size:14px;font-weight:600;margin-bottom:12px;}
  .suggest .sug-head .muted{font-weight:400;}
  .suggest .sug-pair{display:flex;align-items:center;justify-content:center;gap:14px;}
  .suggest .sug-face{flex:1;max-width:180px;text-align:center;}
  .suggest .sug-face>img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;
    background:var(--panel2);display:block;}
  .suggest .sug-face .facecollage{border-radius:10px;overflow:hidden;}
  .suggest .sug-lbl{font-size:13px;font-weight:600;margin-top:6px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .suggest .sug-cnt{font-size:11px;color:var(--muted);}
  .suggest .sug-q{flex:none;font-size:26px;color:var(--muted);}
  .suggest .sug-btns{display:flex;gap:10px;margin-top:14px;}
  .suggest .sug-btns button{flex:1;padding:9px 0;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);color:var(--fg);font-size:13px;cursor:pointer;transition:all .12s;}
  .suggest .sug-yes{border-color:var(--accent)!important;}
  .suggest .sug-yes:hover{background:var(--accent);color:#fff;}
  .suggest .sug-no:hover,.suggest .sug-skip:hover{border-color:var(--muted);}
  .suggest .sug-extra{margin-top:10px;text-align:center;}
  .suggest .sug-extra button{background:none;border:none;color:var(--muted);font-size:12px;
    cursor:pointer;padding:4px;}
  .suggest .sug-extra button:hover{color:var(--fg);text-decoration:underline;}

  /* person detail: a sticky topbar keeps back-nav + name reachable while the
     photo grid below (often thousands of tiles) scrolls out of view. */
  .facetopbar{position:sticky;top:0;z-index:5;background:var(--bg);
    display:flex;align-items:center;gap:14px;padding:12px 0;margin-bottom:14px;
    border-bottom:1px solid var(--line);}
  .facetopbar .back{flex:none;color:var(--accent);cursor:pointer;font-size:13px;}
  .facetopbar .back:hover{text-decoration:underline;}
  .facetopbar .ftb-name{flex:1;min-width:0;display:flex;align-items:center;gap:8px;}
  .facetopbar .ftb-name .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .facetopbar .ftb-name .nm.un{color:var(--muted);font-weight:400;font-style:italic;}
  .facetopbar .ftb-count{flex:none;font-size:12px;}

  .soonbox{padding:50px;text-align:center;color:var(--muted);}
  .soonbox .big{font-size:40px;margin-bottom:10px;}

  /* modal */
  .modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:20;}
  .modal.open{display:flex;}
  .viewer{display:flex;max-width:96vw;max-height:94vh;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .viewer .media{background:#000;display:flex;align-items:center;justify-content:center;max-width:74vw;}
  .viewer .media img,.viewer .media video{max-width:74vw;max-height:94vh;object-fit:contain;}
  .viewer .info{width:320px;flex:none;padding:16px;overflow:auto;max-height:94vh;}
  .viewer .info h3{margin:0 0 10px;font-size:14px;word-break:break-all;}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .kv .k{color:var(--muted);}
  .kv .v{text-align:right;word-break:break-word;}
  /* editable detail sections */
  .isec{margin-top:16px;}
  .isec>.h{display:flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;
    letter-spacing:.5px;color:var(--muted);margin-bottom:8px;}
  .isec>.h .linkbtn{margin-left:auto;}
  .facelist{display:flex;flex-direction:column;gap:9px;}
  .facerow{display:flex;align-items:center;gap:10px;}
  .facecrop{width:46px;height:46px;border-radius:8px;object-fit:cover;background:var(--panel2);
    flex:none;border:1px solid var(--line);}
  .facerow .fsel{flex:1;min-width:0;max-width:none;padding:6px 8px;font-size:12.5px;}
  .info .fsel{max-width:none;width:100%;}
  .dtrow{display:flex;gap:6px;margin-bottom:8px;}
  .dtrow input{flex:1;min-width:0;padding:7px 8px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font:inherit;font-size:12.5px;}
  .dtrow .yr{flex:1.8;}
  .placepick{height:190px;border-radius:8px;overflow:hidden;margin:8px 0;border:1px solid var(--line);}
  .btnrow{display:flex;gap:8px;margin-top:8px;}
  .val{font-size:13px;word-break:break-word;}
  .close{position:absolute;top:14px;right:18px;font-size:26px;color:#fff;cursor:pointer;z-index:21;}
  /* transient, non-blocking notice (used when an optimistic save is rolled back) */
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);
    z-index:40;background:var(--panel2);color:var(--text);border:1px solid var(--line);
    padding:10px 16px;border-radius:9px;font-size:13px;max-width:80vw;box-shadow:0 8px 24px #0009;
    opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.err{border-color:#c0504d;}
</style>
</head>
<body>

<!-- ARCHIVE PICKER -->
<div id="picker">
  <h1>organize_archive</h1>
  <div class="sub">Select an archive, or add a directory to catalog.</div>
  <div class="cards" id="archcards"></div>
</div>

<!-- APP SHELL -->
<div id="app">
  <nav id="nav">
    <div class="brand"><img src="/icon-192.png" width="22" height="22" style="border-radius:5px">
      <span class="brandtxt">organize_archive</span>
      <span class="navtoggle" onclick="toggleNav()" title="Collapse sidebar">«</span></div>
    <span class="back" onclick="toPicker()">← all archives</span>
    <div class="arch" id="archname"></div>
    <div id="navitems"></div>
    <div id="gstat" class="gstat"></div>
  </nav>
  <main id="main"></main>
</div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="if(event.target.id==='modal')closeModal()">
  <span class="close" onclick="closeModal()">×</span>
  <div class="viewer"><div class="media" id="mmedia"></div><div class="info" id="minfo"></div></div>
</div>

<script>
const TYPE_ICON={image:"🖼️",video:"🎞️",audio:"🎵",document:"📄",archive:"🗜️",other:"📦"};
const TYPE_COL={image:"#5b9dff",video:"#c77dff",audio:"#57c98b",document:"#e6b45e",archive:"#9aa3b2",other:"#8b93a3"};
const SECTIONS=[

// Bumped on every user navigation (section switch / archive open). Async renders
// capture it and bail if it changed while they were awaiting, so a slow fetch can
// never paint a stale section over the one the user just picked.
let NAV=0;

function fmtBytes(n){if(n==null)return "—";const u=["B","KB","MB","GB","TB"];let i=0,f=n;
  while(f>=1024&&i<4){f/=1024;i++;}return f.toFixed(1)+" "+u[i];}
async function jget(u){return (await fetch(u,{cache:"no-store"})).json();}
async function jpost(u,b){return (await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})})).json();}
// Serialize all persistence through ONE in-flight write. A GUI write can block for
// a few seconds waiting for the background pipeline's single SQLite writer; firing
// several at once ties up the browser's ~6 connections with stalled POSTs and the
// whole app hangs (reads/polling/images can't get a connection). Chaining keeps at
// most one write occupying a connection, so reads always stay responsive. The
// optimistic UI has already updated, so queueing the actual write is invisible.
let _wq=Promise.resolve();
function qpost(u,b){
  const run=()=>jpost(u,b);
  const p=_wq.then(run,run);      // run regardless of the previous write's outcome
  _wq=p.catch(()=>{});            // a rejection must not break the chain
  return p;
}

let ARCHIVES=[];
async function loadPicker(){
  const {archives}=await jget("/api/archives"); ARCHIVES=archives;
  const el=document.getElementById("archcards"); el.innerHTML="";
  archives.forEach(a=>{
    const c=document.createElement("div"); c.className="card"; c.onclick=()=>openArchive(a);
    const warn=a.exists?"":'<span class="badge-warn">⚠ not mounted</span>';
    const enr=a.enriched<a.files?`<span class="badge-warn">${(a.files-a.enriched).toLocaleString()} not enriched</span>`:"";
    c.innerHTML=`<h3>${a.name} ${warn}</h3><div class="path">${a.path}</div>
      <div class="stats"><span>${a.files.toLocaleString()} files</span>
      <span>${fmtBytes(a.size)}</span>${enr}</div>
      <div class="cardfoot"><span class="muted">Catalog only</span><button class="remove-archive">Remove</button></div>`;

async function addArchive(){
  const p=prompt("Full path to the directory to catalog:");
  if(!p)return;
  const r=await jpost("/api/archives",{path:p});
  if(r.error){alert(r.error);return;}
  await loadPicker();
}
async function removeArchive(a){
  const message=`Remove “${a.name}” from organize_archive?\n\nThis removes its catalog entries and exclusive cached thumbnails. Your original files in:\n${a.path}\nwill not be changed.`;
  if(!confirm(message))return;
  const r=await jpost("/api/archive/remove",{root_id:a.id});
  if(r.error){alert(r.error);return;}
  await loadPicker();
}

  });

    `<div class="type-summary-segment" style="width:${100*t.count/totalTypes}%;background:${TYPE_COL[t.type]||TYPE_COL.other}" title="${t.type}: ${t.count.toLocaleString()} files"></div>`
  ).join("")}</div><div class="type-summary-legend">${types.map(t=>
    `<span><span class="type-summary-key" style="background:${TYPE_COL[t.type]||TYPE_COL.other}"></span>${t.type} <span class="muted">, ${(100*t.count/totalTypes).toFixed(1)}%</span></span>`

// Everything (scan → extract → faces → dedup) runs automatically in the
// background with no user intervention; this panel only reports what's
// happening. There is no pause/stop — it runs until the app is closed.
const JOB_LABEL={scan:"Scanning for new files…",enrich:"Extracting dates, places & metadata…",
  faces:"Detecting faces…",places:"Mapping places…",dedup:"Checking images for visual duplicates…"};
function renderSyncPanel(){
  const el=document.getElementById("syncstatus"); if(!el)return;
  const active=S.activeJobs||{};
  const runningKind=active.scan?"scan":active.enrich?"enrich":active.faces?"faces":active.places?"places":active.dedup?"dedup":null;
  if(runningKind){
    el.innerHTML=`<div class="d"><span class="spin"></span>${JOB_LABEL[runningKind]}</div>`;
    return;
  }
  const f=S.fresh, s=S.summary;
  if(f&&f.checked&&f.new_files>0){
    el.innerHTML=`<div class="d pending"><span class="dot pending"></span>${f.new_files.toLocaleString()} new file${f.new_files===1?"":"s"} found — scanning shortly…</div>`;
  } else if(s&&s.total>s.enriched){
    el.innerHTML=`<div class="d pending"><span class="dot pending"></span>Extracting dates &amp; metadata shortly…</div>`;
  } else if(f&&f.not_faced>0){
    el.innerHTML=`<div class="d pending"><span class="dot pending"></span>Detecting faces in ${f.not_faced.toLocaleString()} photo${f.not_faced===1?"":"s"} shortly…</div>`;
  } else {
    el.innerHTML=`<div class="d ok"><span class="dot ok"></span>Up to date — scanned, dated, faces &amp; duplicates.</div>`;
  }
}
async function loadFreshness(){
  S.fresh=null;
  try{
    const r=await jget("/api/freshness?root="+S.arch.id);
    S.fresh={checked:true,new_files:r.new_files||0,not_faced:r.not_faced||0};
  }catch(e){ S.fresh={checked:true,new_files:0,not_faced:0}; }
  renderSyncPanel();
}
async function refreshJobs(){
  const area=document.getElementById("jobarea"); if(!area)return;
  const {jobs}=await jget("/api/jobs?root="+S.arch.id);
  const active=jobs.filter(j=>j.status==="running");
  S.activeJobs={scan:active.some(j=>j.kind==="scan"),enrich:active.some(j=>j.kind==="enrich"),
    faces:active.some(j=>j.kind==="faces"),places:active.some(j=>j.kind==="places"),
    dedup:active.some(j=>j.kind==="dedup")};
  renderSyncPanel();
  area.innerHTML="";
  active.forEach(j=>{
    const pct=j.percent!=null?j.percent:0;
    const div=document.createElement("div"); div.className="job";
    const progressKind=j.kind==="dedup"?"images":j.kind;
    div.innerHTML=`<div class="progress"><div class="progfill" style="width:${pct}%"></div></div>
      <div class="cur">${progressKind}: ${pct}% · ${j.done.toLocaleString()}${j.total?"/"+j.total.toLocaleString():""} · ${j.elapsed}s${j.current?" · "+j.current:""}</div>`;
    area.appendChild(div);
  });
  // Re-render the overview once, only when a job has just finished (active→idle) so
  // the stats reflect the completed work. Guarding on the transition matters: the
  // newest job stays "done" forever, so re-rendering whenever `jobs[0]` is done would
  // loop endlessly (renderOverview→startPoll→refreshJobs→renderOverview…), pegging the
  // CPU and repainting Overview over whatever section the user navigates to.
  const justFinished=S.wasActive && !active.length;
  S.wasActive=active.length>0;
  if(justFinished){
    loadFreshness();
    if(S.section==="overview")renderOverview(document.getElementById("main"));
  }
}
function startPoll(){stopPoll(); S.poll=setInterval(refreshJobs,1200); refreshJobs();}
function stopPoll(){if(S.poll){clearInterval(S.poll);S.poll=null;}}

function monotonePath(ctx,xs,ys){
  // Fritsch-Carlson monotone cubic: smooth but never overshoots the data,
  // so a line can't dip below zero or spike between points.
  const n=xs.length;
  if(n===1){return;}
  const dx=[],slope=[];
  for(let i=0;i<n-1;i++){dx[i]=xs[i+1]-xs[i];slope[i]=(ys[i+1]-ys[i])/dx[i];}
  const t=new Array(n); t[0]=slope[0]; t[n-1]=slope[n-2];
  for(let i=1;i<n-1;i++) t[i]=(slope[i-1]*slope[i]<=0)?0:(slope[i-1]+slope[i])/2;
  for(let i=0;i<n-1;i++){
    if(slope[i]===0){t[i]=0;t[i+1]=0;continue;}
    const a=t[i]/slope[i], b=t[i+1]/slope[i], h=Math.hypot(a,b);
    if(h>3){const tau=3/h;t[i]=tau*a*slope[i];t[i+1]=tau*b*slope[i];}
  }
  ctx.moveTo(xs[0],ys[0]);
  for(let i=0;i<n-1;i++){
    const h=dx[i];
    ctx.bezierCurveTo(xs[i]+h/3, ys[i]+t[i]*h/3, xs[i+1]-h/3, ys[i+1]-t[i+1]*h/3, xs[i+1], ys[i+1]);
  }
}
// Draws one type's curve normalized to its own max (0..1), so each type's
// shape is comparable regardless of volume. Per-type totals live in the
// legend above the canvas, not inside the plot.
function drawTypeChart(canvasId, rows, ordered, maxByType){
  const cv=document.getElementById(canvasId); if(!cv)return;
  const ctx=cv.getContext("2d");
  const W=cv.width,H=cv.height,padL=40,padR=16,padB=28,padT=14;
  ctx.clearRect(0,0,W,H);
  const n=rows.length;
  const X=i=> padL + (n===1?(W-padL-padR)/2 : i*(W-padL-padR)/(n-1));
  const Y=frac=> H-padB - frac*(H-padT-padB);
  [0,0.25,0.5,0.75,1].forEach(frac=>{
    const y=Y(frac);
    ctx.strokeStyle=frac===0?"#3a414e":"#232833";
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
  });
  ctx.font="10px system-ui"; ctx.textAlign="right"; ctx.textBaseline="middle";
  ctx.fillStyle="#9aa3b2"; ctx.fillText("0",padL-8,Y(0));
  ordered.forEach(t=>{
    const xs=rows.map((r,i)=>X(i)), ys=rows.map(r=>Y((r[t]||0)/(maxByType[t]||1)));
    if(n===1){ctx.fillStyle=TL_COL[t];ctx.beginPath();ctx.arc(xs[0],ys[0],3,0,7);ctx.fill();return;}
    ctx.beginPath(); monotonePath(ctx,xs,ys);
    ctx.lineTo(xs[n-1],H-padB); ctx.lineTo(xs[0],H-padB); ctx.closePath();
    ctx.fillStyle=TL_COL[t]+"1e"; ctx.fill();
    ctx.beginPath(); monotonePath(ctx,xs,ys);
    ctx.strokeStyle=TL_COL[t]; ctx.lineWidth=2; ctx.lineJoin="round"; ctx.stroke();
  });
  ctx.fillStyle="#9aa3b2"; ctx.textAlign="center"; ctx.textBaseline="top";
  const step=Math.max(1,Math.ceil(n/12));
  rows.forEach((r,i)=>{ if(i%step===0||i===n-1)ctx.fillText(r.period,X(i),H-padB+8); });
}
function drawTypeLegend(legendId, ordered, totalsByType){
  const leg=document.getElementById(legendId); leg.innerHTML="";
  ordered.forEach(t=>{
    const sp=document.createElement("span");
    sp.innerHTML=`<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${TL_COL[t]};margin-right:6px"></span>`+
      t+` <span class="muted">, ${totalsByType[t].toLocaleString()}</span>`;
    leg.appendChild(sp);
  });
}
async function drawTimeline(bucket){
  const t=S.timeline;
  t.bucket=bucket;
  const p=new URLSearchParams({root:S.arch.id,bucket});
  if(t.year)p.set("year",t.year); if(t.month)p.set("month",t.month);
  if(t.person)p.set("person",t.person); if(t.place)p.set("place",t.place);
  const {series}=await jget("/api/timeline?"+p);
  const cv2=document.getElementById("tlc2");
  const leg=document.getElementById("tllegend");
  if(!cv2)return;
  if(!series.length){
    cv2.getContext("2d").clearRect(0,0,cv2.width,cv2.height);
    const filtered=t.year||t.person||t.place;
    leg.innerHTML=`<span class="muted">${filtered?"No dated media matches these filters.":"No dated media yet, run Extract on the Overview tab."}</span>`;
    return;
  }
  const types=["image","video","audio"].filter(t=>series.some(s=>s[t]));
  const totalsByType={};
  types.forEach(t=>{totalsByType[t]=series.reduce((a,s)=>a+(s[t]||0),0);});
  const ordered=types.slice().sort((a,b)=>totalsByType[b]-totalsByType[a]);

  const running=Object.fromEntries(types.map(t=>[t,0]));
  const cumRows=series.map(s=>{
    const row={period:s.period};
    types.forEach(t=>{running[t]+=s[t]||0; row[t]=running[t];});
    return row;
  });
  const cumMax={}; types.forEach(t=>{cumMax[t]=Math.max(totalsByType[t],1);});
  drawTypeChart("tlc2", cumRows, ordered, cumMax);
  drawTypeLegend("tllegend", ordered, totalsByType);
}

/* ---------- map (Leaflet: place clusters, optional basemap) ----------
   Photos within 300m of each other are grouped server-side into one named
   "place" (organize_archive/geo/clusters.py). The screen-pixel bucketing
   below is a second, purely visual layer on top of that: at far zoom it
   still merges nearby PLACES into one numbered bubble; at close zoom each
   place stands alone as a small thumbnail collage + name. ---------- */
let MAP=null, MAP_LAYER=null, MAP_TILES=null, MAP_CLUSTERS=[];
function basemapOn(){ return localStorage.getItem("basemap")!=="off"; }
async function renderMap(m){
  m.innerHTML=`<h2 class="sec">Map</h2>
    <div class="chips">
      <span class="muted" id="mapnote">Loading…</span>
      <label style="font-size:12px;cursor:pointer;margin-left:auto">
        <input type="checkbox" id="basemap" ${basemapOn()?"checked":""} onchange="toggleBasemap()"> Street map
      </label>
    </div>
    <div class="mapwrap">
      <div id="lmap"></div>
      <div id="mapside"><div class="empty">Click a place on the map to see its photos here.</div></div>
    </div>
    <div class="muted" style="margin-top:8px;font-size:12px">Photos within 300m of each other are grouped into one named place — click a place to browse it; zoom out and nearby places bundle into a numbered cluster.
      <b>Street map</b> fetches map tiles online (only coordinates are sent — your photos never leave this machine).</div>`;
  if(MAP){MAP.remove();MAP=null;MAP_LAYER=null;}
  S.mapSel=null;
  const {clusters}=await jget("/api/map/clusters?root="+S.arch.id);
  MAP_CLUSTERS=clusters;
  const total=clusters.reduce((a,c)=>a+c.count,0);
  document.getElementById("mapnote").textContent=clusters.length
    ? `${total.toLocaleString()} geolocated items in ${clusters.length.toLocaleString()} places`
    : "No geolocated media yet — places appear automatically as GPS is found in Takeout or EXIF.";
  MAP=L.map("lmap",{worldCopyJump:true,attributionControl:false});
  applyBasemap();
  if(!clusters.length){ MAP.setView([0,0],2); return; }
  const b=L.latLngBounds(clusters.map(c=>[c.lat,c.lon]));
  MAP.fitBounds(b,{padding:[40,40],maxZoom:14});
  MAP.on("moveend zoomend",drawClusters);
  drawClusters();
}
function collageHTML(ids){
  if(!ids.length)return `<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:20px">📍</div>`;
  const n=Math.min(ids.length,4);
  const imgs=ids.slice(0,4).map(id=>`<img src="/thumb/${id}" loading="lazy" onerror="this.remove()">`).join("");
  return `<div class="cgrid n${n}">${imgs}</div>`;
}
async function selectPlaceCluster(id){
  S.mapSel=id;
  drawClusters();
  const side=document.getElementById("mapside");
  side.innerHTML=`<div class="muted">Loading…</div>`;
  const c=await jget("/api/map/cluster/"+id);
  if(S.mapSel!==id)return; // superseded by a newer click
  const safeName=(c.name||"").replace(/'/g,"\\'").replace(/"/g,"&quot;");
  side.innerHTML=`
    <div class="mapside-name" id="mapsidename">
      <span id="mapsidenametext">${c.name?c.name:'<span class="muted">Unnamed place</span>'}</span>
      <button class="linkbtn" onclick="editClusterName(${id},'${safeName}')">${c.name?"Rename":"Name this place"}</button>
    </div>
    <div class="muted" style="margin:2px 0 10px;font-size:12px">${c.members.length.toLocaleString()} item${c.members.length===1?"":"s"}</div>
    <div class="grid" id="mapsidegrid" style="grid-template-columns:repeat(auto-fill,minmax(80px,1fr))"></div>`;
  const grid=document.getElementById("mapsidegrid");
  c.members.forEach(it=>grid.appendChild(tile(it)));
}
function editClusterName(id, current){
  const box=document.getElementById("mapsidename");
  box.innerHTML=`<input id="mapsidenameinput" value="${current}" placeholder="Name this place"
      style="width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit">
    <div style="margin-top:6px;display:flex;gap:8px">
      <button class="btn" onclick="saveClusterName(${id})">Save</button>
      <button class="btn sec" onclick="selectPlaceCluster(${id})">Cancel</button>
    </div>`;
  document.getElementById("mapsidenameinput").focus();
}
async function saveClusterName(id){
  const name=document.getElementById("mapsidenameinput").value.trim();
  await jpost("/api/map/cluster/rename",{cluster_id:id,name});
  const mc=MAP_CLUSTERS.find(c=>c.id===id); if(mc)mc.name=name||null;
  drawClusters();
  selectPlaceCluster(id);
}
function applyBasemap(){
  if(!MAP)return;
  if(basemapOn()){
    if(!MAP_TILES){
      MAP_TILES=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19});
    }
    MAP_TILES.addTo(MAP);
    document.getElementById("lmap").style.background="";
  }else if(MAP_TILES){
    MAP.removeLayer(MAP_TILES);
    document.getElementById("lmap").style.background="#11141a";
  }
}
function toggleBasemap(){
  localStorage.setItem("basemap",document.getElementById("basemap").checked?"on":"off");
  applyBasemap();
}
function drawClusters(){
  if(!MAP)return;
  if(MAP_LAYER)MAP.removeLayer(MAP_LAYER);
  MAP_LAYER=L.layerGroup().addTo(MAP);
  const R=54; // px screen-bucket radius -- groups nearby PLACES at low zoom
  const bounds=MAP.getBounds(), buckets={};
  MAP_CLUSTERS.forEach(c=>{
    if(!bounds.contains([c.lat,c.lon]))return;
    const pt=MAP.latLngToContainerPoint([c.lat,c.lon]);
    const key=Math.round(pt.x/R)+"_"+Math.round(pt.y/R);
    (buckets[key]=buckets[key]||[]).push(c);
  });
  Object.values(buckets).forEach(grp=>{
    const lat=grp.reduce((a,c)=>a+c.lat,0)/grp.length;
    const lon=grp.reduce((a,c)=>a+c.lon,0)/grp.length;
    if(grp.length===1){
      const c=grp[0];
      const badge=c.count>c.thumb_ids.length?`<span class="mk-badge">${c.count>999?"999+":c.count}</span>`:"";
      const icon=L.divIcon({className:"",iconSize:[46,46],html:
        `<div class="mk${c.id===S.mapSel?" mk-sel":""}">${collageHTML(c.thumb_ids)}${badge}</div>`});
      const mk=L.marker([lat,lon],{icon}).addTo(MAP_LAYER).on("click",()=>selectPlaceCluster(c.id));
      mk.bindTooltip(c.name||"Unnamed place",{direction:"top",offset:[0,-24],opacity:0.95});
    }else{
      const total=grp.reduce((a,c)=>a+c.count,0);
      const rep=grp[0].thumb_ids[0];
      const icon=L.divIcon({className:"",iconSize:[52,52],html:
        `<div class="mk mk-cluster">${rep?`<img src="/thumb/${rep}" onerror="this.remove()">`:""}<span>${total.toLocaleString()}</span></div>`});
      L.marker([lat,lon],{icon}).addTo(MAP_LAYER).on("click",()=>{
        MAP.flyToBounds(L.latLngBounds(grp.map(c=>[c.lat,c.lon])),{padding:[60,60],maxZoom:16});
      });
    }
  });
}

async function renderPhotos(m){

async function updateSemanticStatus(){
  const el=document.getElementById("semantic-status"); if(!el||!S.arch)return;
  try{
    const s=await jget("/api/browse/semantic/status?root="+S.arch.id);
    if(!document.getElementById("semantic-status"))return;
    const j=(await jget("/api/jobs?root="+S.arch.id)).jobs.find(x=>x.kind==="semantic"&&x.status==="running");
    const progress=j?` Indexing ${j.done.toLocaleString()} / ${j.total.toLocaleString()}${j.current?` · ${j.current}`:""}…`:
      (s.pending?` ${s.pending.toLocaleString()} media still need indexing.`:"");
    const keyNote=s.configured?"":" Add VOYAGE_API_KEY to the root .env file and restart the app.";
    el.innerHTML=`<span class="dot ${s.indexed?"ok":"check"}"></span>${s.indexed.toLocaleString()} indexed`
      +`${s.skipped?`, ${s.skipped.toLocaleString()} skipped`:""}${s.errors?`, ${s.errors.toLocaleString()} errors`:""}.`
      +progress+` <span style="opacity:.8">Indexing sends images and MP4 video to Voyage; vectors stay local. Audio, PDFs, and other video formats are skipped.</span>`
      +` <span style="opacity:.8">${j?"Automatic indexing is running.":"Automatic indexing starts when compatible media is pending."}${keyNote}</span>`;
    // The scheduler briefly pauses between resumable batches. Keep polling
    // while there is remaining work so the status does not appear to vanish.
    if(j||s.pending)setTimeout(updateSemanticStatus, 2000);
  }catch(e){el.textContent="Semantic search needs VOYAGE_API_KEY in the app environment.";}
}
function semanticSubmit(ev){
  ev.preventDefault();

async function buildFilterBar(){
  const gen=NAV;
  const f=await jget("/api/browse/filters?root="+S.arch.id);
  if(gen!==NAV)return;
  S.filterOpts=f;
  const bar=document.getElementById("filterbar"); if(!bar)return;
  const years=[...new Set((f.periods||[]).map(p=>p.slice(0,4)))];
  const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
  const opt=(v,l)=>`<option value="${v}">${l}</option>`;
  const parts=[];
  if(years.length)
    parts.push(`<select class="fsel" id="f-year" onchange="onYearChange()">`+
      opt("","All years")+years.map(y=>opt(y,y)).join("")+`</select>`+
      `<select class="fsel" id="f-month" onchange="applyFilters()" disabled>`+
      opt("","All months")+`</select>`);
  if(f.types&&f.types.length>1)
    parts.push(`<select class="fsel" id="f-type" onchange="applyFilters()">`+
      opt("","All types")+f.types.map(t=>opt(t,cap(t))).join("")+`</select>`);
  if(f.people&&f.people.length)
    parts.push(`<select class="fsel" id="f-person" onchange="applyFilters()">`+
      opt("","Anyone")+f.people.map(p=>opt(p.id,esc(p.name))).join("")+`</select>`);
  if(f.places&&f.places.length)
    parts.push(`<select class="fsel" id="f-place" onchange="applyFilters()">`+
      opt("","Anywhere")+f.places.map(p=>opt(p.id,esc(p.name))).join("")+`</select>`);
  parts.push(`<button class="linkbtn" id="f-clear" onclick="clearFilters()" style="display:none">Clear filters</button>`);
  bar.innerHTML=parts.join("");

function onYearChange(){
  const y=document.getElementById("f-year").value;
  const msel=document.getElementById("f-month");
  if(msel){
    if(!y){ msel.innerHTML='<option value="">All months</option>'; msel.disabled=true; }
    else{
      // .filter(Boolean): a year-only period ("2024", from a manual year-precision
      // date) yields an empty month slice — drop it so no blank month option appears.
      const months=[...new Set((S.filterOpts.periods||[])
        .filter(p=>p.slice(0,4)===y).map(p=>p.slice(5,7)).filter(Boolean))].sort();
      msel.innerHTML='<option value="">All months</option>'+
        months.map(mm=>`<option value="${mm}">${MONTH_NAMES[+mm-1]}</option>`).join("");
      msel.disabled=false;
    }
  }
  applyFilters();
}
function selVal(id){const e=document.getElementById(id);return e?e.value:"";}
function applyFilters(){

function clearFilters(){

function toggleDups(){

async function loadGrid(){
  const g=S.grid, gen=g.gen, p=new URLSearchParams({root:S.arch.id,offset:g.offset,limit:120});
  if(g.dups)p.set("dups","1");
  if(g.type)p.set("type",g.type); if(g.year)p.set("year",g.year);
  if(g.month)p.set("month",g.month);
  if(g.person)p.set("person",g.person); if(g.place)p.set("place",g.place);
  if(g.query)p.set("q",g.query);
  const res=await jget((g.query?"/api/browse/semantic/search?":"/api/media?")+p);
  // Bail if a newer filter change (or a section switch) superseded this fetch
  // while it was in flight, so a slow response can't paint stale tiles.
  if(S.grid!==g||g.gen!==gen)return;
  const grid=document.getElementById("grid"); if(!grid)return;
  // A failed/empty response has no items array; treat it as "no more" so a
  // clear+fetch that errors can't leave a bare "Load more" button behind.
  const items=(res&&res.items)||[];
  items.forEach(it=>grid.appendChild(tile(it)));
  const count=(res&&res.count)||0;
  g.offset+=count; g.loaded+=count;
  document.getElementById("gmore").style.display=count>=120?"block":"none";
  if(!g.loaded)
    grid.innerHTML=`<div class="muted" style="grid-column:1/-1;padding:40px;text-align:center">${res&&res.error?esc(res.error):"No media matches these filters."}</div>`;
  const gc=document.getElementById("gridcount");
  if(gc)gc.textContent=g.loaded?`${g.loaded.toLocaleString()} ${g.query?"semantic results":"shown"}${count>=120?"+":""}`:"";
}
function tile(it){
  const d=document.createElement("div"); d.className="tile"; d.onclick=()=>openItem(it.id);
  if(it.type==="image"||it.type==="video"){const img=document.createElement("img");img.loading="lazy";
    img.src="/thumb/"+it.id;img.onerror=()=>img.replaceWith(ph(TYPE_ICON[it.type]||"🖼️"));d.appendChild(img);}
  else d.appendChild(ph(TYPE_ICON[it.type]||"📦"));
  const cap=document.createElement("div");cap.className="cap";
  cap.innerHTML=`<span>${(it.date||"").slice(0,10)}</span><span>${it.type==="video"?"▶":""}</span>`;
  d.appendChild(cap);
  if(it.has_gps){const b=document.createElement("div");b.className="badge";b.textContent="📍";d.appendChild(b);}
  return d;
}
function ph(icon){const s=document.createElement("div");s.className="ph";s.textContent=icon;return s;}

async function renderDedup(m){

      <p class="muted">This runs automatically once files are scanned and dated — see the Overview tab for progress. Groups byte-identical copies and visually identical image exports (such as re-compressed JPG/PNG/HEIC files); nothing is ever deleted, extra copies are just hidden from browsing.</p></div>`;
    return;
  }
  m.innerHTML=`<h2 class="sec">Duplicates</h2>
    <div class="statrow">
      <div class="stat"><div class="k">Duplicate groups</div><div class="v">${ds.groups.toLocaleString()}</div></div>
      <div class="stat"><div class="k">Redundant copies</div><div class="v">${ds.duplicates.toLocaleString()}</div></div>
      <div class="stat"><div class="k">Reclaimable</div><div class="v">${fmtBytes(ds.reclaimable)}</div></div>
    </div>
    <div class="muted" style="margin-bottom:12px">Exact copies and visually identical image exports. The <span style="color:var(--good)">✓ kept</span> copy stays in Browse; the rest are hidden (never deleted). Biggest space first.</div>
    <div id="dupgroups"></div>
    <div class="more" id="dupmore" style="display:none"><button class="btn sec" onclick="loadDupGroups()">Load more</button></div>`;
  S.dupoff=0; document.getElementById("dupgroups").innerHTML=""; loadDupGroups();
}
async function loadDupGroups(){
  const res=await jget(`/api/dups?root=${S.arch.id}&offset=${S.dupoff}&limit=40`);
  const wrap=document.getElementById("dupgroups");
  res.groups.forEach(g=>{
    const row=document.createElement("div"); row.className="dupgroup";
    const head=`<div class="dghead"><b>${g.count}×</b> · ${fmtBytes(g.size_each)} each ·
      <span class="muted">${fmtBytes(g.reclaimable)} reclaimable</span></div>`;
    const tiles=g.members.map(mm=>{
      const kept=mm.role==="canonical";
      const tag=kept ? '<span class="keep">✓ kept</span>'
        : mm.match_type==="identical" ? '<span class="duptag exact">Identical copy</span>'
        : '<span class="duptag visual">Visual match</span>';
      const thumb=(mm.type==="image"||mm.type==="video")?`<img src="/thumb/${mm.id}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'${TYPE_ICON[mm.type]||"📦"}'}))">`
        :`<div class="ph">${TYPE_ICON[mm.type]||"📦"}</div>`;
      return `<div class="duptile ${kept?'kept':''}" title="${mm.folder}" onclick="openItem(${mm.id})">
        ${thumb}<div class="dtcap">${tag}</div>
        <div class="dtpath">${mm.folder||'/'}</div></div>`;
    }).join("");
    row.innerHTML=head+`<div class="duprow">${tiles}</div>`;
    wrap.appendChild(row);
  });
  S.dupoff+=res.count;
  document.getElementById("dupmore").style.display=res.count>=40?"block":"none";
}

// Faces run automatically as part of the background pipeline (scan → dates →
// faces → duplicates); this panel only reports status. Clustering into people
// re-runs automatically after every detection chunk, so there is no manual
// start/stop/recompute — it all happens on its own and halts only on app close.
function renderFaceControls(){
  const el=document.getElementById("facectl"); if(!el)return;
  const sum=S.faceSum;
  if(S.faceJobRunning){
    el.innerHTML=`<div class="d"><span class="spin"></span>Detecting faces locally…</div>`;
  } else if(sum.unscanned>0){
    const first=sum.scanned===0;
    const note=`${sum.unscanned.toLocaleString()} photo${sum.unscanned===1?"":"s"} not yet scanned — runs automatically${first?" (first run fetches a ~38 MB face model once)":""}.`;
    el.innerHTML=`<div class="d pending"><span class="dot pending"></span>${note}</div>`;
  } else {
    el.innerHTML=`<div class="d ok"><span class="dot ok"></span>All ${sum.total_images.toLocaleString()} photos scanned.</div>`;
  }
}
function setText(id,v){const e=document.getElementById(id); if(e)e.textContent=v;}
function startFacePoll(){ stopPoll(); S.poll=setInterval(faceTick,1500); faceTick(); }
// Live refresh while a faces job runs: the stat tiles and progress bar tick
// every poll; the people grid re-renders only when a new clustering pass has
// landed (people/faces counts changed), so thumbnails don't flicker in between.
async function faceTick(){
  const area=document.getElementById("facejob"); if(!area){stopPoll();return;}
  const [{jobs},sum]=await Promise.all([
    jget("/api/jobs?root="+S.arch.id),
    jget("/api/faces/summary?root="+S.arch.id)]);
  const fj=jobs.find(j=>j.kind==="faces"&&j.status==="running");
  const wasRunning=S.faceJobRunning; S.faceJobRunning=!!fj;
  const prev=S.faceSum||{}; S.faceSum=sum;
  setText("fs-people",sum.people.toLocaleString());
  setText("fs-faces",sum.faces.toLocaleString());
  setText("fs-photos",sum.photos_with_faces.toLocaleString());
  const sc=document.getElementById("fs-scanned");
  if(sc)sc.innerHTML=`${sum.scanned.toLocaleString()} <small>/ ${sum.total_images.toLocaleString()}</small>`;
  renderFaceControls();
  if(fj){
    const pct=fj.percent!=null?fj.percent:0;
    area.innerHTML=`<div class="job"><div class="progress"><div class="progfill" style="width:${pct}%"></div></div>
      <div class="cur">${pct}% · ${fj.done.toLocaleString()}${fj.total?"/"+fj.total.toLocaleString():""} · ${fj.elapsed}s${fj.current?" · "+fj.current:""}</div></div>`;
    if(sum.people!==prev.people||sum.faces!==prev.faces) renderPeople();
  } else {
    area.innerHTML="";
    if(wasRunning) renderPeople();   // final pass finished → refresh grid
  }
}
async function renderPeople(){
  const wrap=document.getElementById("peoplewrap"); if(!wrap)return;
  const {people}=await jget("/api/faces/persons?root="+S.arch.id+"&limit=300");
  if(!people.length){
    const s=S.faceSum;
    wrap.innerHTML=`<div class="soonbox"><div class="big">🙂</div>`+(
      s.faces>0
        ? `<p>No recurring people found yet.</p><p class="muted">${s.faces.toLocaleString()} face${s.faces===1?"":"s"} detected, but none repeat often enough to group into a person. People appear automatically as more photos are scanned.</p>`
        : (s.scanned>0
            ? `<p>No faces detected in the scanned photos.</p>`
            : `<p>No faces yet — detection runs automatically in the background.</p>`))+`</div>`;
    return;
  }
  wrap.innerHTML=`<div id="suggestwrap"></div><div class="people" id="peoplegrid"></div>`;
  const grid=document.getElementById("peoplegrid");
  people.forEach(p=>grid.appendChild(personCard(p)));
  loadSuggestions();
}
async function loadSuggestions(){
  const sug=await jget("/api/faces/suggestions?root="+S.arch.id+"&limit=60").catch(()=>null);
  S.suggest={list:(sug&&sug.suggestions)||[], idx:0, total:(sug&&sug.total)||0};
  renderSuggest();
}
function renderSuggest(){
  const w=document.getElementById("suggestwrap"); if(!w)return;
  const st=S.suggest||{list:[],idx:0,total:0}, s=st.list[st.idx];
  if(!s){ w.innerHTML=""; return; }
  const left=Math.max(1, (st.total||st.list.length)-st.idx);
  const face=o=>`<div class="sug-face">
      ${faceCollage(o.faces_preview&&o.faces_preview.length?o.faces_preview:[o.cover_face_id])}
      <div class="sug-lbl">${o.name?esc(o.name):('Unnamed #'+o.id)}</div>
      <div class="sug-cnt">${o.faces.toLocaleString()} face${o.faces===1?'':'s'}</div></div>`;
  w.innerHTML=`<div class="suggest">
    <div class="sug-head">Same person? <span class="muted">· ${left.toLocaleString()} to review · ${Math.round(s.sim*100)}% match</span></div>
    <div class="sug-pair">${face(s.a)}<div class="sug-q">≟</div>${face(s.b)}</div>
    <div class="sug-btns">
      <button class="sug-yes" onclick="answerSuggest('same')">Same person</button>
      <button class="sug-no" onclick="answerSuggest('different')">Not the same</button>
      <button class="sug-skip" onclick="answerSuggest('skip')">Skip</button>
    </div>
    <div class="sug-extra"><button onclick="answerSuggest('notpeople')">🚫 Neither is a person — hide both (dolls / pets / cartoons)</button></div>
    </div>`;
}
async function answerSuggest(kind){
  const st=S.suggest, s=st.list&&st.list[st.idx]; if(!s)return;
  // drop any later queued pair that references a now-removed cluster
  const dropRefs=ids=>{ st.list=st.list.filter((x,ix)=>ix<=st.idx||(!ids.includes(x.a.id)&&!ids.includes(x.b.id))); };
  if(kind==='same'){
    const res=await jpost('/api/faces/merge',{a:s.a.id,b:s.b.id});
    if(res&&res.error){ alert(res.error); return; }
    if(res&&res.person){ const kept=res.person.id, dropped=(s.a.id===kept?s.b.id:s.a.id); dropRefs([dropped]); renderPeopleGrid(); }
  }else if(kind==='different'){
    await jpost('/api/faces/different',{a:s.a.id,b:s.b.id});
  }else if(kind==='skip'){
    await jpost('/api/faces/skip',{a:s.a.id,b:s.b.id});
  }else if(kind==='notpeople'){
    await jpost('/api/faces/hide',{person_id:s.a.id});
    await jpost('/api/faces/hide',{person_id:s.b.id});
    dropRefs([s.a.id,s.b.id]); renderPeopleGrid();
  }
  if(st.total>0) st.total--;
  st.idx++;
  if(st.idx>=st.list.length){ renderPeople(); return; }  // reload grid + fresh queue
  renderSuggest();
}
async function renderPeopleGrid(){
  const grid=document.getElementById("peoplegrid"); if(!grid)return;

async function hidePerson(id){
  if(!confirm('Not a person? Its faces get marked as a doll/animal/cartoon and are left out of clustering. It disappears from People.'))return;
  await jpost('/api/faces/hide',{person_id:id});
  backToPeople();
}
// Up to 4 faces as a 2x2 collage (a single face fills the square). `ids` is the
// person's faces_preview, with cover_face_id as fallback for old payloads.
function faceCollage(ids){
  ids=(ids||[]).filter(Boolean).slice(0,4);
  if(ids.length<=1){
    const id=ids[0];
    return id?`<img class="face" src="/faceThumb/${id}" loading="lazy" onerror="this.style.visibility='hidden'">`
             :`<div class="face"></div>`;
  }
  let cells="";
  for(let i=0;i<4;i++) cells+= ids[i]
    ? `<img src="/faceThumb/${ids[i]}" loading="lazy" onerror="this.style.visibility='hidden'">`
    : `<div class="cempty"></div>`;
  return `<div class="facecollage">${cells}</div>`;
}
function personCard(p){
  const d=document.createElement("div"); d.className="pcard"; d.onclick=()=>showPerson(p.id);
  const cover=faceCollage(p.faces_preview&&p.faces_preview.length?p.faces_preview:[p.cover_face_id]);
  const nm=p.name?`<div class="pname">${esc(p.name)}</div>`:`<div class="pname un">Unnamed #${p.id}</div>`;
  d.innerHTML=cover+`<div class="pmeta">${nm}<div class="pcount">${p.photos.toLocaleString()} photo${p.photos===1?"":"s"}</div></div>`;
  return d;
}

async function savePersonName(id){
  const inp=document.getElementById("personnameinput");
  const btn=inp&&inp.parentElement?inp.parentElement.querySelector("button.btn"):null;
  const name=inp.value.trim();
  if(btn){btn.disabled=true;btn.textContent="Saving…";}
  let r;

  catch(e){ r={error:String(e)}; }

    err.textContent=(r&&r.error)?("Couldn’t save — "+r.error):"Couldn’t save — try again";

  showPerson(id);
}

/* ---------- detail modal (editable: faces / place / date) ---------- */
let MITEM=null;                 // the currently-open item, mutated in place on edit
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(v){
  if(!v)return "—";
  const p=v.split("T")[0].split("-");
  if(p.length===1)return p[0];                                  // year
  if(p.length===2)return (MONTHS[(+p[1])-1]||p[1])+" "+p[0];     // year-month
  return v.replace("T"," ");                                     // full day/datetime
}

/* ----- faces: reassign to a named person (pinned server-side) ----- */
function faceRow(f){
  const named=MITEM.person_options||[];
  const isNamed=f.person_id&&f.name;
  let opts=isNamed?"":`<option value="" selected>${f.name?esc(f.name):"— unknown —"}</option>`;
  named.forEach(p=>{opts+=`<option value="${p.id}"${p.id===f.person_id?" selected":""}>${esc(p.name)}</option>`;});
  if(!named.length&&!isNamed)
    return `<div class="facerow"><img class="facecrop" src="/faceThumb/${f.face_id}" loading="lazy" onerror="this.style.visibility='hidden'">
      <span class="muted" style="font-size:12px">Name people in the Faces section to label them here.</span></div>`;
  return `<div class="facerow">
    <img class="facecrop" src="/faceThumb/${f.face_id}" loading="lazy" onerror="this.style.visibility='hidden'">
    <select class="fsel" title="Reassign this face" onchange="reassignFace(${f.face_id},this.value,this)">${opts}</select></div>`;
}
// Optimistic saves: update the panel now, persist in the background, and roll back
// only if the DB write actually fails — so editing feels instant even while the
// pipeline holds the single writer. Every background callback bails out (or re-checks
// stillOpen) if the modal has since closed or moved to another item.
let _toastT=null;
function toast(msg,isErr){
  let t=document.getElementById("toast");
  if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);}
  t.textContent=msg; t.className="show"+(isErr?" err":"");
  clearTimeout(_toastT); _toastT=setTimeout(()=>{t.className=isErr?"err":"";},2800);
}
function stillOpen(id){return MITEM&&MITEM.id===id;}

function reassignFace(faceId,pid,sel){
  if(!pid)return;
  const f=(MITEM.people||[]).find(x=>x.face_id===faceId);
  const prev=f?{person_id:f.person_id,name:f.name}:null;
  const opt=(MITEM.person_options||[]).find(p=>p.id===+pid);
  if(f&&opt){f.person_id=opt.id;f.name=opt.name;}   // optimistic (the select already shows it)
  flashSaved(sel);
  const revert=(msg)=>{
    if(f&&prev){f.person_id=prev.person_id;f.name=prev.name;}
    if(sel.isConnected)sel.value=(prev&&prev.name)?String(prev.person_id):"";
    toast(msg,true);
  };
  qpost("/api/faces/reassign",{face_id:faceId,person_id:+pid})
    .then(r=>{if(!(r&&r.ok))revert("Couldn’t reassign that face — "+((r&&r.error)||"try again"));})
    .catch(()=>revert("Couldn’t reassign that face — connection error"));
}
function flashSaved(el){const o=el.style.borderColor;el.style.transition="border-color .2s";
  el.style.borderColor="var(--good)";setTimeout(()=>{el.style.borderColor=o;el.style.transition="";},900);}

  document.getElementById("dateval").innerHTML=`
    <div class="dtrow">
      <input class="yr" id="d-y" type="text" inputmode="numeric" maxlength="4" placeholder="Year" value="${p[0]||""}">
      <input id="d-m" type="text" inputmode="numeric" maxlength="2" placeholder="Mon" value="${p[1]?(+p[1]):""}">
      <input id="d-d" type="text" inputmode="numeric" maxlength="2" placeholder="Day" value="${p[2]?(+p[2]):""}">
    </div>
    <div class="muted" style="font-size:11px">Enter only what you know — year alone is fine.</div>
    <div class="btnrow"><button class="btn" onclick="saveDate()">Save</button>
      <button class="btn sec" onclick="renderInfo()">Cancel</button></div>`;
  document.getElementById("d-y").focus();
}
function saveDate(){
  const y=document.getElementById("d-y").value.trim(),
        mo=document.getElementById("d-m").value.trim(),
        da=document.getElementById("d-d").value.trim();
  if(!y){toast("Year is required.",true);return;}
  const pad=v=>String(v).padStart(2,"0");
  let v=String(+y);
  if(mo){v+="-"+pad(+mo);if(da)v+="-"+pad(+da);}   // day needs a month
  const id=MITEM.id, prev={date:MITEM.date,src:MITEM.date_source};
  MITEM.date=v; MITEM.date_source="manual"; renderInfo();   // instant
  const revert=(msg)=>{
    if(stillOpen(id)){MITEM.date=prev.date;MITEM.date_source=prev.src;renderInfo();}
    toast(msg,true);
  };
  qpost("/api/item/date",{file_id:id,datetime:v})
    .then(r=>{if(!(r&&r.ok))revert("Couldn’t save the date — "+((r&&r.error)||"try again"));})
    .catch(()=>revert("Couldn’t save the date — connection error"));
}

/* ----- place: attach to a named place, or create one by pin ----- */
function editPlace(){
  const cur=MITEM.place?MITEM.place.id:"";
  let sel=`<select class="fsel" onchange="onPlaceSelect(this.value)"><option value="">— No place —</option>`;
  (MITEM.place_options||[]).forEach(p=>sel+=`<option value="${p.id}"${p.id===cur?" selected":""}>${esc(p.name)}</option>`);
  sel+=`</select>`;
  document.getElementById("placeval").innerHTML=sel+
    `<div class="btnrow"><button class="btn sec" onclick="newPlace()">＋ New place</button>
       <button class="linkbtn" onclick="renderInfo()">Done</button></div>
     <div id="p-pick"></div>`;
}
function onPlaceSelect(pid){
  const id=MITEM.id, prev=MITEM.place;
  MITEM.place=pid?((MITEM.place_options||[]).find(p=>p.id===+pid)||{id:+pid,name:null}):null;
  renderInfo();   // instant — collapses the editor back to display
  const body=pid?{file_id:id,place_id:+pid}:{file_id:id,clear:true};
  const revert=(msg)=>{if(stillOpen(id)){MITEM.place=prev;renderInfo();}toast(msg,true);};
  qpost("/api/item/place",body)
    .then(r=>{if(!(r&&r.ok))revert("Couldn’t update the place — "+((r&&r.error)||"try again"));})
    .catch(()=>revert("Couldn’t update the place — connection error"));
}
let MPICK=null,MPICK_MARK=null,MPICK_LL=null;
function closePick(){if(MPICK){MPICK.remove();MPICK=null;}MPICK_MARK=null;MPICK_LL=null;}
function newPlace(){
  const host=document.getElementById("p-pick");
  host.innerHTML=`
    <input id="np-name" placeholder="Place name (e.g. Casa abuela)"
      style="width:100%;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;margin:8px 0 0;box-sizing:border-box">
    <div class="placepick" id="np-map"></div>
    <div class="muted" style="font-size:11px;margin:-2px 0 2px">Click the map to drop a pin — that becomes the place’s location.</div>
    <div class="btnrow"><button class="btn" id="np-save" onclick="saveNewPlace()" disabled>Create & attach</button>
      <button class="btn sec" onclick="closePick();editPlace()">Cancel</button></div>`;
  const start=MITEM.gps?[MITEM.gps.lat,MITEM.gps.lon]:null;
  MPICK=L.map("np-map",{attributionControl:false});
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(MPICK);
  if(start){MPICK.setView(start,15);dropPin(start[0],start[1]);}else MPICK.setView([20,0],1);
  MPICK.on("click",e=>dropPin(e.latlng.lat,e.latlng.lng));
  setTimeout(()=>MPICK&&MPICK.invalidateSize(),60);
}
function dropPin(lat,lon){
  MPICK_LL={lat,lon};
  if(MPICK_MARK)MPICK_MARK.setLatLng([lat,lon]);
  else MPICK_MARK=L.circleMarker([lat,lon],{radius:8,weight:2,color:"#fff",fillColor:"#3a7bd5",fillOpacity:1}).addTo(MPICK);
  const b=document.getElementById("np-save");if(b)b.disabled=false;
}
function saveNewPlace(){
  if(!MPICK_LL){toast("Click the map to set the location first.",true);return;}
  const id=MITEM.id, root=MITEM.root_id, prev=MITEM.place;
  const name=(document.getElementById("np-name").value||"").trim();
  const ll={lat:MPICK_LL.lat,lon:MPICK_LL.lon};
  closePick();
  MITEM.place={id:null,name:name||null}; renderInfo();   // instant (id filled in when it lands)
  qpost("/api/places/create",{root,name,lat:ll.lat,lon:ll.lon,file_id:id}).then(r=>{
    if(r&&r.ok){
      if(stillOpen(id)){
        MITEM.place=r.place;
        if(r.place&&r.place.name)(MITEM.place_options=MITEM.place_options||[]).push(r.place);
        renderInfo();
      }
    }else{
      if(stillOpen(id)){MITEM.place=prev;renderInfo();}
      toast("Couldn’t create the place — "+((r&&r.error)||"try again"),true);
    }
  }).catch(()=>{
    if(stillOpen(id)){MITEM.place=prev;renderInfo();}
    toast("Couldn’t create the place — connection error",true);
  });
}

function closeModal(){closePick();document.getElementById("modal").classList.remove("open");
  document.getElementById("mmedia").innerHTML="";MITEM=null;}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

loadPicker().then(applyHash);
</script>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "organize-archive"
version = "0.1.2"
description = "Local, read-only cataloging tool for a large family multimedia archive"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

# The core (scan/index/status) runs on the stdlib plus the exiftool and ffprobe
# system binaries. The optional extras below add richer output and later phases.
dependencies = []

[project.optional-dependencies]
# Nicer CLI output. Core still works without it.
cli = ["rich>=13"]
# Metadata + perceptual dedup (Phase 3/4).
media = ["pyexiftool>=0.5", "Pillow>=10", "pillow-heif>=0.16", "ImageHash>=4.3"]
# Face detection + clustering (Phase 6). Fully local: InsightFace's buffalo_l
# SCRFD det_10g detector (weights fetched once into the cache dir) plus the
# self-exported AdaFace ir101 embedder, both on onnxruntime, and scikit-learn's
# agglomerative merge stages. The k-NN searches that build and expand cluster
# cores are blocked GEMM over NumPy; faiss-cpu accelerates them if it happens to
# be installed, but it is not a dependency — see organize_archive/faces/knn.py.
# insightface itself is a pure-Python wheel — it supplies the model-zoo loader
# and the face alignment helpers, not the inference engine.
# No model server, no cloud.
faces = ["insightface>=1.0", "onnxruntime>=1.20", "opencv-python>=4.8", "scikit-learn>=1.3", "numpy>=1.24"]
# Local YOLOX animal detection plus DINOv2 pet re-identification. Kept separate so
# a catalogue that does not need Pets avoids another model download. The DINOv2
# ONNX has no upstream URL: packaged builds bundle it, and a source checkout
# exports it once with tools/build/dinov2_pet_export.py.
pets = ["onnxruntime>=1.20", "opencv-python>=4.8", "numpy>=1.24", "Pillow>=10", "pillow-heif>=0.16"]
# Local semantic search: the SigLIP 2 base/16@256 vision and text towers on
# onnxruntime, plus the Gemma SentencePiece tokenizer for query text. `tokenizers`
# is a Rust extension but publishes cp310-abi3 wheels for manylinux x86_64 and
# win_amd64, so it needs no compiler on the release runners. Deliberately NOT
# transformers or torch — a 64-token tokenizer does not justify reversing the
# torch exclusion in packaging/organize-archive.spec.
semantic = ["onnxruntime>=1.20", "tokenizers>=0.20", "numpy>=1.24", "Pillow>=10", "pillow-heif>=0.16"]
# faiss-cpu is a dev dependency and not a runtime one: the desktop build excludes
# it, but tests/integration/test_core_expansion.py asserts the FAISS and NumPy
# search paths agree exactly, and those tests skip themselves when it is absent.
# Dropping it here too would leave the equivalence claim unverified -- which is
# the claim that makes excluding it from the installer a size decision rather
# than a clustering one.
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pre-commit>=3", "mypy>=1.11", "faiss-cpu>=1.13"]

[project.scripts]
oa = "organize_archive.cli:main"
organize-archive-backend = "organize_archive.desktop:main"

[tool.setuptools.packages.find]
include = ["organize_archive*"]

[tool.setuptools.package-data]
"organize_archive.db" = ["*.sql"]
"organize_archive.web" = ["*.html", "vendor/*", "static/css/*", "static/js/*", "*.png"]

# Without this, a bare `pytest` from the repo root walks build output too: a
# packaged desktop build under desktop/ vendors whole third-party test suites,
# and collecting them fails the run before any real test executes.
[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers turns a typo'd marker into a collection error. Without it
# `@pytest.mark.slwo` is a silent no-op: the test stays in the fast tier forever
# and nobody finds out.
addopts = "--strict-markers"
# tests/ is not importable on its own: with no __init__.py, pytest puts each test
# file's *own* directory on sys.path, so tests/gui/ cannot see tests/helpers.py.
# This is what lets all three tiers share helpers.py and factories.py.
pythonpath = ["tests"]
markers = [
  # Applied from measurement, not from a guess about mechanism. "Spawns a
  # thread" sounds like the better rule but is useless here: JobManager starts
  # a scheduler thread in its constructor, so it would mark the whole gui tier
  # -- which runs 57 tests in 1.5s, because those tests park the thread and
  # drive the scheduler by hand. Re-measure with --durations before adding one.
  "slow: measured over ~1s (re-check with --durations, don't assume)",
  "models: needs ONNX weights or a tokenizer checkpoint on disk",
  # Applied automatically to everything under tests/browser (its conftest's
  # pytest_collection_modifyitems), never written by hand. It exists so the
  # default suite can deselect the tier: those tests start a real Chrome, and
  # `make test` must not depend on one being installed. `make test-browser`
  # is how you ask for them.
  "browser: drives a real headless Chrome (deselected by `make test`)",
]

# Coverage is a map of where a refactor is flying blind, not a target. There is
# deliberately no --cov-fail-under: a percentage gate rewards testing trivial
# getters and punishes deleting dead code, both of which stages 06-11 do a lot of.
[tool.coverage.run]
source = ["organize_archive"]
omit = ["*/web/vendor/*", "*/__main__.py"]

[tool.coverage.report]
skip_covered = false
show_missing = true

# Type checking is gradual on purpose. A whole-package strict switch produces
# hundreds of errors nobody reads, and the tool becomes noise. So there are two
# lists here and they move in opposite directions:
#
#   "not reviewed yet"  -- ignore_errors, and only ever SHRINKS
#   "strict"            -- the real checks, and only ever GROWS
#
# A package leaves the first list and joins the second in one commit, once its
# errors are actually gone. `mypy organize_archive` is therefore green at every
# commit, which is what makes it usable as a gate instead of a report.
#
# Section order is load-bearing: mypy applies every matching override in file
# order, so the strict block must come after the ignored one and say
# ignore_errors = false explicitly to win for a sub-package (web.routes vs web).
[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
# Lenient global default: an unannotated function is not an error, and its body
# is not checked. Annotated code still is -- that is the free half of the deal.
check_untyped_defs = false
# onnxruntime, insightface, cv2 and PIL ship no stubs worth the install.
ignore_missing_imports = true

# ---- not reviewed yet: errors suppressed so the gate is usable today ----
# Measured at 48f949a, not guessed: these are exactly the packages that had
# errors under the lenient default above (102 of them). Delete a line from this
# list only when that package is clean, in the same commit that makes it strict.
[[tool.mypy.overrides]]
module = [
  "organize_archive.dedup.*",
  "organize_archive.detect.*",
  "organize_archive.embeddings.*",
  "organize_archive.faces.*",
  "organize_archive.geo.*",
  "organize_archive.pets.*",
  "organize_archive.thumbnails.*",
  "organize_archive.web.*",
]
ignore_errors = true

# ---- strict: the work is done here ----
[[tool.mypy.overrides]]
module = [
  "organize_archive.paths",
  "organize_archive.errors",
  "organize_archive.metadata.*",
  "organize_archive.config.*",
  "organize_archive.db.*",
  "organize_archive.services.*",
  "organize_archive.web.routes.*",
  "organize_archive.pipeline.*",
]
ignore_errors = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict_optional = true
warn_return_any = true

[tool.ruff]
line-length = 100          # matches the style already in the files
target-version = "py313"
# Same reasoning as testpaths above: desktop/ and build/ hold packaged output,
# including vendored third-party Python that is not ours to lint or format.
# adaface_net.py is vendored verbatim from upstream AdaFace and carries exactly
# one documented deviation; formatting or "fixing" it would make that claim
# impossible to verify with a diff against upstream.
#
# The leading slashes matter. These patterns are gitignore-style, so a bare
# "build/" matches *any* directory named build at any depth -- which silently
# swallowed all of tools/build/ and left four scripts unlinted and unformatted.
extend-exclude = ["/desktop/", "/build/", "/.venv/", "tools/build/adaface_net.py"]
# Honour the excludes even when a path is passed explicitly. Without this,
# pre-commit -- which always names the changed files -- reformats the vendored
# AdaFace net that the exclude above exists to protect.
force-exclude = true

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle    — whitespace, line length, obvious layout errors
  "F",        # pyflakes       — unused imports/variables, undefined names
  "I",        # isort          — import order (stdlib / third-party / local)
  "B",        # bugbear        — mutable defaults, loop-variable capture, broad except
  "UP",       # pyupgrade      — modernises to 3.13 idioms
  "C4",       # comprehensions — needless list()/dict() wrapping
  "SIM",      # simplify       — collapsible ifs, redundant bool conversion
  "RUF",      # ruff's own     — mutable class attrs, unused noqa
  "T20",      # flake8-print   — print() in the library; see per-file-ignores
  # pydocstyle, but only the four rules that ask for content. Deliberately NOT
  # the whole `D` set: D205/D209/D210 are layout (the formatter owns that, and
  # turning them on would reflow 100+ docstrings that read fine), D400/D415 want
  # a full stop on a summary line that is already a sentence fragment on
  # purpose, and D401 rewrites accurate summaries into the imperative mood.
  # D102 (public method) is absent because there is nothing to fix: the strict
  # packages have no undocumented public methods, and adding it would only bind
  # future code. Add it when that stops being true.
  "D100",     # module docstring: what lives here and what does not
  "D101",     # public class
  "D103",     # public function — the one that carries real information here
  "D104",     # package (__init__.py)
]
ignore = [
  "E501",     # line length: the formatter owns this; a long SQL string is not a bug
  "B008",     # function call in default arg — used deliberately in a few places
  # `try: ... except X: pass` was expected to disappear once the logging sweep
  # turned those sites into handlers that record what went wrong. Most did. The
  # five that remain are silent *correctly*, and each now carries a comment
  # saying why: a client that has already disconnected, a decode-speed hint that
  # did not apply, a directory that does not exist on a fresh install. They run
  # per-request or per-image, so logging them would drown the log in non-events.
  # Still not `contextlib.suppress` candidates -- suppress() has nowhere to put
  # the comment that is the whole value of these handlers.
  "SIM105",
]
# `×` is the multiplication sign in dimension strings ("1920×1080"), not a typo'd
# letter x. It is the only confusable this codebase uses on purpose.
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
# D100/D104 (module and package docstrings) are on for the whole library and
# already satisfied: every module and package says what it is. D101/D103 are the
# expensive ones, so they are on only where the public surface has actually been
# documented -- services/, db/, metadata/, and (as it turns out) web/routes/,
# which was already complete from stage 08. Everything else is listed below.
#
# This is the same only-ever-shrinks list as mypy's "not reviewed yet" block,
# and it moves the same way: delete a line only in the commit that documents
# that package. It is NOT the same membership -- config/ and pipeline/ are
# mypy-strict but still exempt here, because typing a package and documenting
# its public surface are separate pieces of work.
"tests/*"  = ["B011", "D100", "D101", "D103", "D104"]   # a test's name is its documentation
"tools/*"  = ["T201", "D100", "D101", "D103", "D104"]   # dev scripts may print
"packaging/scripts/*" = ["T201", "D100", "D101", "D103", "D104"]  # build-time scripts
"organize_archive/config/*.py" = ["D101", "D103"]
"organize_archive/dedup/*.py" = ["D101", "D103"]
"organize_archive/desktop.py" = ["D101", "D103"]
"organize_archive/detect/*.py" = ["D101", "D103"]
"organize_archive/embeddings/*.py" = ["D101", "D103"]
"organize_archive/faces/*.py" = ["D101", "D103"]
"organize_archive/geo/*.py" = ["D101", "D103"]
"organize_archive/hashing/*.py" = ["D101", "D103"]
"organize_archive/media/*.py" = ["D101", "D103"]
"organize_archive/paths.py" = ["D101", "D103"]
"organize_archive/pets/*.py" = ["D101", "D103"]
"organize_archive/pipeline/*.py" = ["D101", "D103"]
"organize_archive/scan/*.py" = ["D101", "D103"]
"organize_archive/thumbnails/*.py" = ["D101", "D103"]
"organize_archive/web/*.py" = ["D101", "D103"]
# cli/ *is* the user interface: printing is its job, and routing its output
# through logging would timestamp and re-order the tables it prints. Every other
# module in the library logs instead -- a library that prints cannot be silenced,
# redirected, or given a severity, and writes nowhere inside the desktop app.
"organize_archive/cli/*.py" = ["T201", "D101", "D103"]

[tool.ruff.format]
quote-style = "double"          # matches the existing code

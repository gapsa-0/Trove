name: Release candidate
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to build
        required: true
        default: main
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            package: win
          - os: ubuntu-latest
            target: linux-x64
            package: linux
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE_TOOL_TARGET: ${{ matrix.target }}
      ARCHIVE_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ inputs.ref }}' }
      - uses: actions/setup-python@v7
        with: { python-version: '3.13', cache: pip }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: python -m pip install -e '.[dev]' -r packaging/requirements-desktop.txt
      - run: python packaging/scripts/stage-tools.py --target $env:ARCHIVE_TOOL_TARGET
        if: runner.os == 'Windows'
      - run: python packaging/scripts/stage-tools.py --target "$ARCHIVE_TOOL_TARGET"
        if: runner.os != 'Windows'
      - run: npm ci && npm run package:${{ matrix.package }}
        working-directory: desktop
      # Hash exactly the installers that get uploaded, and nothing else.
      # `release/*` also matches electron-builder's intermediate *-unpacked
      # directory, which neither sha256sum nor Get-FileHash can hash: both fail
      # the step, and a failed step here means the installers that were just
      # built are never uploaded. Listing build by-products such as
      # builder-debug.yml is just as wrong in the other direction -- they are
      # not shipped, so `sha256sum -c` against the published SHA256SUMS.txt
      # would report a missing file to every user who checks their download.
      - name: Checksums (Windows)
        working-directory: desktop
        if: runner.os == 'Windows'
        # Filter with Where-Object rather than -Exclude: against a directory
        # path that does not end in \*, -Exclude is matched on the path itself,
        # so Get-ChildItem silently yields nothing and no file is written.
        run: |
          $files = Get-ChildItem -Path release -File |
            Where-Object { $_.Extension -eq '.exe' }
          if (-not $files) { throw "no installer in desktop/release to hash" }
          $files | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), $_.Path.Split('\')[-1] } |
            Set-Content -Path release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt
      - name: Checksums (Linux)
        working-directory: desktop/release
        if: runner.os != 'Windows'
        run: |
          find . -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' \) \
            -printf '%P\n' | sort | xargs -r sha256sum > SHA256SUMS.txt
          test -s SHA256SUMS.txt || { echo "no installer in desktop/release" >&2; exit 1; }
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: 'archive-${{ matrix.target }}'
          retention-days: 14
          # The installers and their checksums, not the unpacked staging tree
          # that sits beside them and roughly doubles the artifact for nothing.
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/SHA256SUMS.txt

name: Release candidate
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to build
        required: true
        default: main
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            package: win
          - os: ubuntu-latest
            target: linux-x64
            package: linux
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE_TOOL_TARGET: ${{ matrix.target }}
      ARCHIVE_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: python -m pip install -e '.[dev]' -r packaging/requirements-desktop.txt
      - run: python packaging/scripts/stage-tools.py --target $env:ARCHIVE_TOOL_TARGET
        if: runner.os == 'Windows'
      - run: python packaging/scripts/stage-tools.py --target "$ARCHIVE_TOOL_TARGET"
        if: runner.os != 'Windows'
      - run: python packaging/scripts/stage-models.py
      - run: npm ci && npm run package:${{ matrix.package }}
        working-directory: desktop
      - run: Get-FileHash release/* -Algorithm SHA256 | Format-List
        working-directory: desktop
        if: runner.os == 'Windows'
      - run: sha256sum release/*
        working-directory: desktop
        if: runner.os != 'Windows'
      - uses: actions/upload-artifact@v4
        with: { name: 'archive-${{ matrix.target }}', path: desktop/release, retention-days: 14 }

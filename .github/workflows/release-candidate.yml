name: Release candidate
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to build
        required: true
        default: main
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            package: win
          - os: ubuntu-latest
            target: linux-x64
            package: linux
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE_TOOL_TARGET: ${{ matrix.target }}
      ARCHIVE_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: python -m pip install -e '.[dev]' -r packaging/requirements-desktop.txt
      - run: python packaging/scripts/stage-tools.py --target $env:ARCHIVE_TOOL_TARGET
        if: runner.os == 'Windows'
      - run: python packaging/scripts/stage-tools.py --target "$ARCHIVE_TOOL_TARGET"
        if: runner.os != 'Windows'
      - run: python packaging/scripts/stage-models.py
      - run: npm ci && npm run package:${{ matrix.package }}
        working-directory: desktop
      # Hash only the distributable files. `release/*` also matches
      # electron-builder's intermediate *-unpacked directory, which neither
      # sha256sum nor Get-FileHash can hash: both fail the step, and a failed
      # step here means the installers that were just built are never uploaded.
      # The SHA256SUMS.txt produced here is the file the install docs tell
      # users to verify their download against.
      - name: Checksums (Windows)
        working-directory: desktop
        if: runner.os == 'Windows'
        run: |
          Get-ChildItem release -File -Exclude SHA256SUMS.txt |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt
      - name: Checksums (Linux)
        working-directory: desktop/release
        if: runner.os != 'Windows'
        # The output file is excluded from its own listing: the shell creates it
        # as the pipeline starts, so an unfiltered find hashes it mid-write.
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\n' |
            sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: 'archive-${{ matrix.target }}'
          retention-days: 14
          # The installers and their checksums, not the unpacked staging tree
          # that sits beside them and roughly doubles the artifact for nothing.
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/SHA256SUMS.txt

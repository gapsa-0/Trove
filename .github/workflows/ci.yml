name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    # Literals only -- see the XDG_DATA_HOME note in the first step for why
    # anything referencing the `runner` context cannot live here.
    # PY: the Makefile defaults to .venv/bin/python and there is no venv here.
    # RUFF_OUTPUT_FORMAT: keeps lint failures annotated inline on the PR diff
    # now that the flag is no longer spelled out in the step.
    env:
      PY: python
      RUFF_OUTPUT_FORMAT: github
    steps:
      # Keep the app's data directory on the runner's scratch disk. This has to
      # be set from a step: the `runner` context does not exist in a job-level
      # `env:` block, and referencing it there makes GitHub reject the whole
      # workflow before any job starts (a 0s run with no jobs and no logs).
      - run: echo "XDG_DATA_HOME=$RUNNER_TEMP/archive-data" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.13', cache: pip }
      # The same install `make setup` performs, so a green run here and a green
      # run on a developer machine mean the same thing. Installing only `.[dev]`
      # was cheaper but tested almost nothing: without numpy the semantic and
      # detection suites either skip or fail, and CI had been reporting a red
      # build over a *collection* error for a day without running one test.
      # `transformers` is deliberately absent -- it is a dev-only reference
      # dependency for tests/unit/test_siglip_preprocessing.py that drags in torch,
      # and that module skips itself cleanly without it.
      - run: python -m pip install -e '.[dev,cli,watch,media,faces,pets,semantic,documents,ocr]' -c constraints.txt
      # Lint before testing: it finishes in under a second, so a style failure
      # reports immediately instead of behind the whole suite.
      #
      # Both steps go through the Makefile rather than inlining the commands, so
      # what CI checks and what `make check` checks cannot drift apart. PY points
      # at the runner's interpreter because there is no .venv here.
      - run: make lint-py
      # docs/dev/api.md is generated from the three route tables, never written
      # by hand, so the only way it can be wrong is by being stale. Checking it
      # here is what makes "add a route, forget the doc" a failed build instead
      # of a document that silently stops describing the server. Cheap: it
      # imports the route tables and renders a string.
      - run: python tools/dev/gen_api_docs.py --check
      # The frontend's screens are ES modules, so an inline on* handler only
      # works if main.js re-exports the function it names onto `window`. Nothing
      # else in CI can see a mismatch: eslint does not read HTML attributes and
      # no test drives a browser -- the button just silently stops working.
      - run: python tools/dev/check_handlers.py
      # A file or function that grows past budget passes every other check
      # here -- ruff and mypy grade style and correctness, not shape. This is
      # the shrink-only ratchet that catches a module quietly becoming the
      # place every future change lands.
      - run: python tools/dev/check_sizes.py
      # Put the PP-OCR weights where the resolver looks before running the
      # suite. Until ADR 0019's amendment they arrived inside the `rapidocr`
      # wheel, so `pip install .[ocr]` above was enough and tests/unit/
      # test_ocr_reading.py ran here without anyone arranging it. Now that the
      # app downloads them, that module skips itself unless they are staged --
      # and a skipped test tier is the failure mode nobody notices, because the
      # build stays green.
      #
      # No download and no release dependency: --only resolves these three out
      # of the installed wheel, which still ships them (the desktop build is
      # what filters them out). The SHA-256 check is the same one every other
      # source goes through, so a rapidocr release that changed the weights
      # fails this step rather than quietly testing different bytes.
      - run: python packaging/scripts/stage-models.py --only ppocr_det,ppocr_rec,ppocr_cls
      - run: make test
      # The frontend is ~4k lines of ES modules that no other step executes:
      # eslint grades syntax and check_handlers.py proves an inline on* names
      # something real, but neither can see a renderer that throws on load or a
      # screen that paints empty over a good response. This drives the real
      # thing in the Chrome the runner image already ships, through the same
      # stdlib DevTools client as the screenshot tooling -- no new dependency
      # and no browser download. It skips itself if no Chrome is found, so it
      # can never turn a missing browser into a red build.
      - run: make test-browser
      - run: python packaging/scripts/stage-tools.py --validate
      - run: python packaging/scripts/stage-models.py --validate
  electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
        working-directory: desktop
      # npm ci exits 0 whether or not Electron's postinstall actually unpacked
      # the binary (docs/adr/0014), and nothing else in this job runs Electron,
      # so without this CI would stay green over an install that produces no
      # runnable app.
      - run: test -f node_modules/electron/path.txt
        working-directory: desktop
      - run: make lint-js
      - run: npm run check:version && npm run test:ready && npm run test:sandbox && node --check src/main.cjs && node --check src/preload.cjs && node --check src/sandbox.cjs
        working-directory: desktop

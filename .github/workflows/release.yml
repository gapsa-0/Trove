name: Public release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    environment: public-release
    permissions:
      contents: write
    env:
      ARCHIVE_TOOL_TARGET: win32-x64
      ARCHIVE_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: python -m pip install -e '.[dev]' -r packaging/requirements-desktop.txt
      - run: python packaging/scripts/stage-tools.py --target $env:ARCHIVE_TOOL_TARGET
      - run: python packaging/scripts/stage-models.py
      # Windows builds are unsigned: there is no signing authority yet, and the
      # README tells users how to get past the SmartScreen warning that causes.
      # To sign later, set the CSC_LINK / CSC_KEY_PASSWORD secrets, restore them
      # as env above, and re-add `--config.win.forceCodeSigning=true` plus an
      # Authenticode check so an unsigned build can never publish as a signed one.
      - run: npm ci && npm run build:backend && npx electron-builder --win nsis
        working-directory: desktop
      - run: node scripts/release-manifest.cjs release
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with: { name: archive-windows, path: desktop/release, retention-days: 14 }
  linux:
    runs-on: ubuntu-latest
    env: { ARCHIVE_TOOL_TARGET: linux-x64, ARCHIVE_BUILD_COMMIT: '${{ github.sha }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: python -m pip install -e '.[dev]' -r packaging/requirements-desktop.txt
      - run: python packaging/scripts/stage-tools.py --target "$ARCHIVE_TOOL_TARGET"
      - run: python packaging/scripts/stage-models.py
      - run: npm ci && npm run package:linux && node scripts/release-manifest.cjs release
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with: { name: archive-linux, path: desktop/release, retention-days: 14 }
  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    environment: public-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release-assets }
      - run: gh release create "$GITHUB_REF_NAME" release-assets/**/* --draft --title "$GITHUB_REF_NAME" --generate-notes
        env: { GH_TOKEN: '${{ github.token }}' }

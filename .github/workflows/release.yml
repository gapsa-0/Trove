name: Public release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    environment: public-release
    permissions:
      contents: write
    env:
      ARCHIVE_TOOL_TARGET: win32-x64
      ARCHIVE_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.13', cache: pip }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: python -m pip install -e '.[dev]' -r packaging/requirements-desktop.txt
      - run: python packaging/scripts/stage-tools.py --target $env:ARCHIVE_TOOL_TARGET
      # Windows builds are unsigned: there is no signing authority yet, and the
      # README tells users how to get past the SmartScreen warning that causes.
      # To sign later, set the CSC_LINK / CSC_KEY_PASSWORD secrets, restore them
      # as env above, and re-add `--config.win.forceCodeSigning=true` plus an
      # Authenticode check so an unsigned build can never publish as a signed one.
      - run: npm ci && npm run build:backend && npx electron-builder --win nsis
        working-directory: desktop
      - run: node scripts/release-manifest.cjs release
        working-directory: desktop
      - uses: actions/upload-artifact@v7
        with: { name: archive-windows, path: desktop/release, retention-days: 14 }
  linux:
    runs-on: ubuntu-latest
    env: { ARCHIVE_TOOL_TARGET: linux-x64, ARCHIVE_BUILD_COMMIT: '${{ github.sha }}' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.13', cache: pip }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: python -m pip install -e '.[dev]' -r packaging/requirements-desktop.txt
      - run: python packaging/scripts/stage-tools.py --target "$ARCHIVE_TOOL_TARGET"
      - run: npm ci && npm run package:linux && node scripts/release-manifest.cjs release
        working-directory: desktop
      - uses: actions/upload-artifact@v7
        with: { name: archive-linux, path: desktop/release, retention-days: 14 }
  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    environment: public-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { path: release-assets }
      # This job has no checkout, so gh cannot infer the repository from a git
      # remote and needs --repo. The installers sit exactly one level down, inside
      # each build job's artifact folder; matching a single level is deliberate,
      # since electron-builder leaves its *-unpacked/ staging directories in the
      # same folder and gh would choke on being handed a directory.
      - run: |
          shopt -s nullglob
          installers=(release-assets/*/*.exe release-assets/*/*.AppImage release-assets/*/*.deb)
          if [ ${#installers[@]} -ne 3 ]; then
            echo "expected 3 installers, found ${#installers[@]}: ${installers[*]}" >&2
            exit 1
          fi
          # Checksums have to name the files as GitHub serves them: it rewrites
          # spaces to dots, so "Trove Setup 1.2.3.exe" downloads as
          # "Trove.Setup.1.2.3.exe" and a checksum under the on-disk name would
          # send anyone verifying a download looking for a file that isn't there.
          : > SHA256SUMS.txt
          for file in "${installers[@]}"; do
            echo "$(sha256sum "$file" | cut -d' ' -f1)  $(basename "$file" | tr ' ' '.')" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "${installers[@]}" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --generate-notes
        env: { GH_TOKEN: '${{ github.token }}' }
